<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ddugi | 지구 종말 방지 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2E2A45;
    --ink-soft:#6B6489;
    --placeholder:#9089AC;
    --line:#DCD3F0;
    --line-soft:#ECE6F7;
    --paper:#FAF7FF;
    --panel:#FFFFFF;
    --blueprint:#8B5CF6;      /* 연보라 주색: 글자·흰 글자 배경용 */
    --blueprint-2:#A78BFA;    /* 연보라 밝은 톤: 테두리·hover·선택 표시용 */
    --blueprint-soft:#F1EAFE; /* 옅은 라벤더 음영 */
    --accent2:#D6579E;        /* 보조색 핑크: 검토·후보 표시용 */
    --accent2-soft:#FDEAF4;
    --amber:#B8944A;
    --amber-soft:#F8F0DD;
    --ok:#5CAE8E;
    --ok-soft:#E6F4EE;
    --danger:#D9577A;
    --radius:14px;
    --serif:'IBM Plex Sans KR', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECE9F5; --ink-soft:#B7AED0; --placeholder:#9C93B8; --line:#453C63; --line-soft:#332B4A;
      --paper:#1B1730; --panel:#241E3D; --blueprint:#C4A6FF; --blueprint-2:#D8C4FF;
      --blueprint-soft:#3B2E5C; --accent2:#F2A6D8; --accent2-soft:#3A2438; --amber:#D3B36A; --amber-soft:#332C1C;
      --ok:#7FCBA8; --ok-soft:#1E332B; --danger:#E884A0;
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECE9F5; --ink-soft:#B7AED0; --placeholder:#9C93B8; --line:#453C63; --line-soft:#332B4A;
    --paper:#1B1730; --panel:#241E3D; --blueprint:#C4A6FF; --blueprint-2:#D8C4FF;
    --blueprint-soft:#3B2E5C; --accent2:#F2A6D8; --accent2-soft:#3A2438; --amber:#D3B36A; --amber-soft:#332C1C;
    --ok:#7FCBA8; --ok-soft:#1E332B; --danger:#E884A0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--serif); font-size:15px; line-height:1.6;
    height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  }
  ::selection{ background:var(--blueprint); color:#fff; }

  /* ---------- layout shell ---------- */
  #shell{ display:flex; width:100%; flex:1; min-height:0; }
  #apphead, #appfoot{ flex:0 0 auto; }
  #apphead{
    background:var(--panel); color:var(--ink); border-bottom:2px solid var(--blueprint-2);
    padding:calc(12px + env(safe-area-inset-top,0px)) 24px 12px; font-size:17px; font-weight:700; letter-spacing:.01em;
    display:flex; align-items:center; gap:10px;
  }
  .apphead-sub{ margin-left:12px; padding-left:12px; border-left:1px solid var(--line); font-size:14px; font-weight:500; color:var(--ink-soft); }
  #appfoot{
    border-top:1px solid var(--line-soft); background:var(--panel); color:var(--ink-soft);
    padding:8px 24px calc(8px + env(safe-area-inset-bottom,0px)); font-size:13px; text-align:left;
  }
  #appfoot summary{ cursor:pointer; font-size:12px; color:var(--ink-soft); list-style:none; }
  #appfoot summary::-webkit-details-marker{ display:none; }
  #appfoot summary::before{ content:'▸ '; }
  #appfoot details[open] summary::before{ content:'▾ '; }
  #appfoot details[open] summary{ margin-bottom:6px; }

  #sidebar{
    width:300px; flex:0 0 300px; background:var(--panel); color:var(--ink);
    border-right:1px solid var(--line-soft);
    display:flex; flex-direction:column;
    padding-top:20px;
    padding-bottom:env(safe-area-inset-bottom,0px);
    overflow-y:auto;
  }
  #sidebar.open{ }
  .brand{ padding:0 20px 16px; border-bottom:1px solid var(--line-soft); }
  .brand .kicker{ font-size:12.5px; color:var(--ink-soft); }
  .brand h1{ font-size:17px; margin:6px 0 0; font-weight:600; line-height:1.35; color:var(--ink); }
  .navlist{ list-style:none; margin:0; padding:8px 0; flex:0 0 auto; }
  .navlist li{ }
  .navbtn{
    width:100%; text-align:left; background:none; border:none; color:var(--ink-soft);
    padding:9px 20px; font-family:var(--serif); font-size:13.5px; cursor:pointer;
    display:flex; align-items:center; gap:10px; border-left:3px solid transparent;
    line-height:1.35; word-break:keep-all; overflow-wrap:anywhere;
  }
  .navbtn .num{ font-family:var(--mono); font-size:12px; color:var(--placeholder); width:26px; flex:0 0 26px; }
  .navbtn:hover{ background:var(--blueprint-soft); }
  .navbtn.active{ background:var(--blueprint-soft); border-left-color:var(--blueprint-2); color:var(--blueprint); font-weight:600; }
  .navbtn .dot{ margin-left:auto; width:6px; height:6px; border-radius:50%; background:transparent; flex:0 0 6px; }
  .navbtn.filled .dot{ background:var(--blueprint-2); }
  .sec-status{ margin-left:auto; font-size:11px; font-weight:600; white-space:nowrap; padding:1px 6px; border-radius:var(--radius); }
  .sec-status.st-partial{ color:var(--blueprint-2); background:var(--blueprint-soft); }
  .sec-status.st-done{ color:var(--ok); background:var(--ok-soft); }
  .navdetails{ border:none; }
  .navdetails > summary.navgroup-summary{
    list-style:none; padding:12px 20px 4px;
    font-size:12.5px; font-weight:700; color:var(--blueprint); letter-spacing:.01em;
    cursor:pointer; display:flex; align-items:center; gap:6px; user-select:none;
  }
  .navdetails > summary.navgroup-summary::-webkit-details-marker{ display:none; }
  .navdetails > summary.navgroup-summary::after{
    content:'▾'; font-size:10px; margin-left:auto; transition:transform .2s;
  }
  .navdetails:not([open]) > summary.navgroup-summary::after{ transform:rotate(-90deg); }
  .navdetails > summary.navgroup-summary:hover{ color:var(--blueprint-2); }
  .navbtn.sub{ padding-left:30px; }
  .navbtn.dim{ opacity:1; background:var(--line-soft); color:var(--ink-soft); }
  .navbtn.dim:hover{ background:var(--blueprint-soft); }
  .navdivider{ margin:10px 20px; border:none; border-top:1px solid var(--line-soft); }
  #modalOverlay .field input{ background:var(--paper); }
  .sidefoot{ padding:14px 20px 18px; border-top:1px solid var(--line-soft); }
  .sidefoot button{
    width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--line);
    padding:8px 10px; font-family:var(--serif); font-size:13px; border-radius:999px; cursor:pointer;
    margin-top:6px;
  }
  .sidefoot button:hover{ background:var(--blueprint-soft); border-color:var(--blueprint-2); }

  /* ---------- main ---------- */
  #main{ flex:1; min-width:0; display:flex; flex-direction:column; overflow-y:auto; }
  #topbar{
    position:sticky; top:0; z-index:5; background:var(--paper);
    border-bottom:1px solid var(--line-soft);
    padding:14px 32px 0;
  }
  .topbar-row{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .breadcrumb{ font-size:13px; color:var(--ink-soft); }
  .breadcrumb b{ color:var(--blueprint-2); }
  #menuToggle{ display:none; }
  .ruler{ display:flex; gap:2px; margin:12px 0 0; padding-bottom:14px; }
  .ruler i{ flex:1; height:5px; background:var(--line-soft); border-radius:1px; }
  .ruler i.on{ background:var(--blueprint-2); }

  #content{ flex:1; padding:28px 32px 80px; display:flex; justify-content:center; }
  .sheet{ width:100%; max-width:980px; }
  .sheet .navfoot{ max-width:none; }
  .sheet .intro p{ max-width:none; }

  .frame{
    position:relative; padding:22px 24px 26px; margin-bottom:22px;
    background:var(--panel); border:1px solid var(--line-soft);
  }
  .frame::before, .frame::after{
    content:""; position:absolute; width:14px; height:14px; pointer-events:none;
  }
  .frame::before{ top:-1px; left:-1px; border-top:2px solid var(--blueprint-2); border-left:2px solid var(--blueprint-2); }
  .frame::after{ bottom:-1px; right:-1px; border-bottom:2px solid var(--blueprint-2); border-right:2px solid var(--blueprint-2); }

  .frame h2{ font-size:20px; margin:0 0 4px; font-weight:700; line-height:1.35; }
  .frame .sub{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); margin-bottom:16px; letter-spacing:.02em; }
  .frame .hint{ font-size:13.5px; color:var(--ink-soft); background:var(--blueprint-soft); border-left:2px solid var(--blueprint-2); padding:8px 10px; margin:-4px 0 14px; font-style:normal; }
  .fieldgroup{ font-size:13px; font-weight:700; color:var(--blueprint); letter-spacing:.02em; margin:22px 0 10px; padding-top:14px; border-top:1px solid var(--line-soft); }

  .field{ margin-bottom:16px; }
  .field:last-child{ margin-bottom:0; }
  .field > label{ display:block; font-size:14px; font-weight:600; margin-bottom:6px; color:var(--ink); }
  .field .fhint{ font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }

  input[type=text], textarea{
    width:100%; font-family:var(--serif); font-size:14px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    padding:9px 10px; resize:vertical;
  }
  input[type=text]:focus, textarea:focus{ outline:2px solid var(--blueprint-2); outline-offset:-1px; background:var(--panel); }
  textarea{ min-height:64px; line-height:1.55; }

  .row-fields{ display:flex; gap:12px; flex-wrap:wrap; }
  .row-fields .field{ flex:1; min-width:140px; }

  .opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .opt{
    display:flex; align-items:center; gap:6px; font-size:13.5px;
    border:1px solid var(--line); border-radius:var(--radius); padding:6px 10px 6px 8px;
    cursor:pointer; background:var(--paper); user-select:none;
  }
  .opt input{ accent-color:var(--blueprint-2); width:14px; height:14px; }
  .opt.checked{ background:var(--blueprint-soft); border-color:var(--blueprint-2); color:var(--blueprint); font-weight:500; }
  .opt-other{ margin-top:8px; max-width:280px; }

  table.dtable, table.ftable{ width:100%; border-collapse:collapse; font-size:14px; }
  table.dtable th, table.ftable th{
    text-align:left; font-weight:600; font-size:12px;
    color:var(--ink-soft); border-bottom:1px solid var(--line); padding:0 8px 6px;
  }
  table.dtable td, table.ftable td{ border-bottom:1px solid var(--line-soft); padding:6px 8px; vertical-align:top; }
  table.ftable td.rowlabel{ font-size:13.5px; font-weight:500; white-space:nowrap; padding-top:9px; color:var(--ink); }
  table.dtable input, table.ftable input, table.dtable textarea{
    border:none; background:transparent; padding:4px 2px; width:100%; font-size:14px;
  }
  table.dtable input:focus, table.ftable input:focus{ outline:1px solid var(--blueprint-2); background:var(--panel); }
  table.dtable td.rmcol{ width:30px; text-align:center; }
  table.ftable .ftcheck{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  table.ftable .ftcheck input{ accent-color:var(--blueprint-2); width:15px; height:15px; margin:0; }
  table.ftable tr.off td.rowlabel{ color:var(--ink-soft); }
  table.ftable tr.off input[type=text]{ background:var(--paper); }
  .rmbtn{
    background:none; border:1px solid var(--line); color:var(--ink-soft); width:22px; height:22px;
    border-radius:50%; cursor:pointer; font-size:13px; line-height:1;
  }
  .rmbtn:hover{ border-color:var(--danger); color:var(--danger); }
  .addbtn{
    margin-top:10px; background:none; border:1px dashed var(--line); color:var(--blueprint-2);
    padding:7px 14px; border-radius:999px; cursor:pointer; font-family:var(--serif); font-size:13px;
  }
  .addbtn:hover{ background:var(--blueprint-soft); border-color:var(--blueprint-2); }

  .grouplist{ display:flex; flex-direction:column; gap:0; }
  .groupitem{ border:1px solid var(--line-soft); border-radius:var(--radius); padding:14px 14px 4px; margin-bottom:12px; position:relative; background:var(--paper); }
  .groupitem .gnum{ position:absolute; top:-9px; left:10px; background:var(--panel); border:1px solid var(--line); font-family:var(--mono); font-size:11.5px; padding:1px 7px; color:var(--blueprint-2); }
  .groupitem .rmbtn{ position:absolute; top:8px; right:8px; }

  .listitem{ display:flex; align-items:flex-start; gap:8px; margin-bottom:8px; }
  .listitem .arrow{ font-family:var(--mono); font-size:12px; color:var(--blueprint-2); padding-top:11px; width:34px; flex:0 0 34px; white-space:nowrap; text-align:right; }
  .listitem input{ flex:1; }

  .navfoot{ display:flex; justify-content:space-between; max-width:720px; margin:0 auto; padding:0 0 40px; }
  .navfoot button{
    font-family:var(--serif); font-size:14px; padding:9px 16px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
    max-width:48%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .ex-nextbar{ display:flex; justify-content:center; margin:4px 0 18px; }
  .ex-nextbar button{
    font-family:var(--serif); font-size:14px; font-weight:600; padding:11px 20px; border-radius:var(--radius);
    border:1px solid var(--blueprint-2); background:var(--blueprint-soft); color:var(--blueprint); cursor:pointer;
  }
  .ex-nextbar button:hover{ background:var(--blueprint-2); color:#fff; }
  .navfoot button:hover{ border-color:var(--blueprint-2); color:var(--blueprint-2); }
  .navfoot button:disabled{ opacity:.35; cursor:default; }
  .navfoot button:disabled:hover{ border-color:var(--line); color:var(--ink); }

  .topactions{ display:flex; gap:8px; align-items:center; }
  .chip-btn{
    font-family:var(--serif); font-size:13px; padding:6px 12px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer;
  }
  .chip-btn:hover{ border-color:var(--blueprint-2); color:var(--blueprint-2); }
  .chip-btn.done{ border-color:var(--ok); color:var(--ok); }
  body.locked-mode #sheet input:disabled,
  body.locked-mode #sheet textarea:disabled{ color:var(--ink); -webkit-text-fill-color:var(--ink); cursor:not-allowed; background:var(--line-soft); }
  ::placeholder{ color:var(--placeholder); opacity:1; }
  #sheet .addbtn:disabled, #sheet .rmbtn:disabled{ display:none; }
  body.locked-mode #sheet .addbtn:disabled,
  body.locked-mode #sheet .rmbtn:disabled{ display:none; }

  /* export */
  .exportbox{ width:100%; min-height:320px; font-family:var(--mono); font-size:12px; white-space:pre; pointer-events:none; user-select:none; }
  .intro{ word-break:keep-all; }
  .intro p{ margin:0 0 12px; max-width:62ch; }
  .intro .intro-lead{ font-size:16px; color:var(--ink); }
  .intro blockquote{ margin:16px 0; padding:10px 14px; border-left:3px solid var(--blueprint-2); background:var(--blueprint-soft); font-weight:600; }
  .intro h3{ font-size:15px; margin:20px 0 8px; }
  .intro ol{ margin:0; padding-left:20px; }
  .intro ol li{ margin-bottom:6px; }
  .intro ol b{ margin-right:6px; }
  .intro ul:not(.intro-principles){ margin:0; padding-left:20px; }
  .intro ul:not(.intro-principles) li{ margin-bottom:6px; }
  .intro-principles{ display:flex; flex-wrap:wrap; gap:8px; list-style:none; padding:0; margin:0; }
  .intro-principles li{ border:1px solid var(--line); border-radius:var(--radius); padding:5px 10px; font-size:13.5px; background:var(--paper); }
  .lvgroup{ margin-bottom:10px; }
  .lvtitle{ font-size:13px; font-weight:700; margin-bottom:6px; }
  .lvtitle span{ font-weight:400; color:var(--ink-soft); margin-left:8px; font-size:12.5px; }
  .tbd{ display:inline-block; font-size:11.5px; font-weight:600; color:var(--amber); background:var(--amber-soft); border:1px solid var(--amber); border-radius:var(--radius); padding:0 6px; margin-bottom:4px; vertical-align:middle; }
  .lvcard{ border:1px solid var(--blueprint-2); background:var(--blueprint-soft); border-radius:var(--radius); padding:10px 14px; margin:4px 0 16px; }
  .lvnow{ font-size:15px; }
  .lvnow span{ font-size:13px; color:var(--ink-soft); margin-left:6px; }
  .lvnext em{ font-style:normal; color:var(--ink-soft); }
  .lvnow b{ color:var(--blueprint); font-size:17px; margin-right:4px; }
  .lvnext{ font-size:13px; color:var(--ink-soft); margin-top:4px; }
  .dashbar{ display:flex; height:10px; border-radius:6px; overflow:hidden; margin:8px 0; background:var(--line-soft); }
  .dashbar-seg{ display:block; height:100%; }
  .dashbar-seg.done{ background:var(--ok); }
  .dashbar-seg.saved{ background:var(--blueprint-2); }
  .dashbar-seg.wip{ background:var(--accent2); }
  .intro .intro-flow{ background:var(--paper); border:1px solid var(--line-soft); padding:10px 12px; border-radius:var(--radius); }
  .ex-sec{ border:1px solid var(--line-soft); border-radius:var(--radius); margin-bottom:10px; background:var(--panel); }
  .ex-sec summary{ cursor:pointer; list-style:none; padding:12px 16px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:14.5px; }
  .ex-sec summary::-webkit-details-marker{ display:none; }
  .ex-sec summary::before{ content:"▶"; font-size:11px; color:var(--blueprint-2); transition:transform .15s; flex:0 0 auto; }
  .ex-sec[open] summary::before{ transform:rotate(90deg); }
  .ex-sec .exn{ font-family:var(--mono); font-size:12px; color:var(--blueprint); flex:0 0 auto; }
  .ex-sec .ex-note{ margin-left:auto; font-size:12.5px; font-weight:500; color:var(--ink-soft); }
  .ex-secbody{ padding:0 16px 16px; border-top:1px solid var(--line-soft); padding-top:14px; }
  .promptedu{ margin:18px 0 4px; border:2px solid var(--blueprint-2); border-radius:var(--radius); padding:12px 16px; background:var(--blueprint-soft); word-break:keep-all; }
  .promptedu summary{ cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .promptedu summary::-webkit-details-marker{ display:none; }
  .promptedu summary::before{ content:"▶"; font-size:11px; color:var(--blueprint-2); transition:transform .15s; }
  .promptedu[open] summary::before{ transform:rotate(90deg); }
  .promptedu summary:hover .pe-title{ text-decoration:underline; }
  .pe-badge{ font-size:12px; font-weight:700; color:#fff; background:var(--blueprint); border-radius:var(--radius); padding:2px 8px; }
  .pe-title{ font-size:15px; font-weight:700; color:var(--blueprint); }
  .pe-hint{ margin-left:auto; font-size:12.5px; color:var(--blueprint-2); border:1px solid var(--blueprint-2); border-radius:var(--radius); padding:2px 8px; background:var(--panel); }
  .promptedu[open] .pe-hint{ display:none; }
  .promptedu[open] summary{ margin-bottom:4px; }
  .promptedu p{ margin:10px 0; }
  .extabs{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .extab{ font-family:var(--serif); font-size:14px; padding:8px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); color:var(--ink); cursor:pointer; }
  .extab:hover{ border-color:var(--blueprint-2); color:var(--blueprint-2); }
  .extab.on{ background:var(--blueprint); border-color:var(--blueprint); color:#fff; font-weight:600; }
  /* === Onboarding meta-tabs === */
  .onb-metatabs{ display:flex; gap:0; margin-bottom:18px; border-bottom:2px solid var(--line); }
  .onb-metatab{ font-family:var(--serif); font-size:15px; padding:10px 18px; border:none; border-bottom:3px solid transparent; background:transparent; color:var(--ink-dim); cursor:pointer; transition:all .2s; white-space:nowrap; }
  .onb-metatab:hover{ color:var(--ink); background:var(--panel); }
  .onb-metatab.on{ color:#2e7d32; border-bottom-color:#4caf50; font-weight:700; }
  /* === Conversational onboarding === */
  .conv-container{ max-width:600px; margin:0 auto; }
  .conv-version-pick{ text-align:center; padding:30px 20px; }
  .conv-version-pick h2{ font-size:22px; margin-bottom:8px; }
  .conv-version-pick p{ color:var(--ink-dim); margin-bottom:24px; }
  .conv-version-btn{ display:block; width:100%; max-width:400px; margin:10px auto; padding:16px 20px; font-size:16px; font-family:var(--serif); border:2px solid #a5d6a7; border-radius:14px; background:linear-gradient(135deg,#e8f5e9,#f1f8e9); color:#2e7d32; cursor:pointer; transition:all .2s; text-align:left; }
  .conv-version-btn:hover{ border-color:#66bb6a; background:linear-gradient(135deg,#c8e6c9,#dcedc8); transform:translateY(-1px); box-shadow:0 3px 12px rgba(76,175,80,.15); }
  .conv-version-btn .cvb-emoji{ font-size:24px; margin-right:8px; }
  .conv-version-btn .cvb-sub{ display:block; font-size:12px; color:#689f38; margin-top:4px; }
  .conv-progress{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }

function replaceArrayContents(arr, next){ if(Array.isArray(next) && next.length){ arr.length=0; arr.push(...next); } }
function replaceObjectContents(obj, next){
  if(next && typeof next==='object' && Object.keys(next).length){
    Object.keys(obj).forEach(k=>delete obj[k]);
    Object.assign(obj, next);
  }
}
async function loadTaxonomy(){
  try{
    const res = await fetch('/api/taxonomy');
    if(!res.ok) return;
    const d = await res.json();
    replaceObjectContents(CATEGORIES, d.categories);
    replaceArrayContents(TARGETS, d.targets);
    replaceArrayContents(WORK_TYPES, d.worktypes);
    replaceArrayContents(TOOLS, d.tools);
    if(typeof d.intro_html==='string' && d.intro_html.trim()) INTRO_HTML = d.intro_html;
    renderSheet();  // 지금 보고 있는 화면을 새 분류로 다시 그림 (이미 고른 값은 그대로 유지)

}

const levelMet = (L, done) => L.items.every(i=>done.indexOf(i)>-1);
function aiLevel(done){
  let lv = 0;
  for(const L of AI_LEVELS.slice(0,4)){ if(levelMet(L, done)) lv = L.lv; else break; }
  if(lv >= 2 && levelMet(AI_LEVELS[4], done)) lv = 5;
  return lv;
}

// 3-3 학습 계획(이번 고민거리에서 경험할 역량) 기준, 계획이 없으면 경험한 역량 기준. 둘 다 없으면 전체 표시
const itemLevel = i => { const L = AI_LEVELS.find(L=>L.items.indexOf(i)>-1); return L ? L.lv : 0; };
function techLevel(done){ let lv = 0; for(const L of AI_LEVELS.slice(0,4)){ if(levelMet(L, done)) lv = L.lv; else break; } return lv; }
function taskLevel(){
  const plan = getV('lp_plan',[]);
  if(plan.length){
    const ax = plan.some(i=>itemLevel(i)===5);
    const tech = Math.max(0, ...plan.map(itemLevel).filter(l=>l<5));
    return {tech: tech || (ax ? 2 : 1), ax, from:'3-3 학습 계획'};
  }
  const done = getV('lp_done',[]);
  return done.length ? {tech: Math.max(1, techLevel(done)), ax:false, from:'경험한 역량'} : null;
}
const taskLevelLabel = t => 'L'+t.tech+(t.ax ? ' + AX' : '');

function aiLevelCardHtml(withPlan){
  const done = getV('lp_done',[]), plan = getV('lp_plan',[]);
  const lv = aiLevel(done), cur = AI_LEVELS[lv-1];
  const need = L => L.items.filter(i=>done.indexOf(i)<0);

  let html = '<div class="lvcard"><div class="lvnow">학습 레벨 <b>'+esc(lvLabel(lv))+'</b> <span>자기 체크 기준'+(cur ? ' · '+esc(cur.q) : '')+'</span></div>'+

  if(lv < 4 && lv !== 5){
    const next = AI_LEVELS[lv];
    html += '<div class="lvnext">기술 경로: 다음 <b>'+esc(lvLabel(next.lv))+'</b>까지 '+need(next).map(esc).join(', ')+'</div>';
  }
  if(lv < 5){
    const ax = AI_LEVELS[4];
    html += '<div class="lvnext">AX 경로: <b>L5 AX Architect</b>까지 '+(lv < 2 ? 'L2를 먼저 갖추고, ' : '')+need(ax).map(esc).join(', ')+' <em>(개발 역량 없이도 가능)</em></div>';
  } else {
    html += '<div class="lvnext">업무 자체를 재설계할 수 있는 단계입니다.</div>';
  }
  if(withPlan && plan.length){
    const after = aiLevel(done.concat(plan));
    if(after > lv) html += '<div class="lvnext">이번 씨앗 계획을 모두 경험하면 <b>'+esc(lvLabel(after))+'</b></div>';

  }
  return html + '</div>';
}
// 학습 계획 추천: AI 진단 결과에 나온 항목, 없으면 다음 레벨까지 남은 항목
function lpRecommendHtml(){
  const done = getV('lp_done',[]), plan = getV('lp_plan',[]);
  const fresh = i => done.indexOf(i)<0 && plan.indexOf(i)<0;
  const all = AI_LEVELS.reduce((a,L)=>a.concat(L.items), []);
  const key = i => i.split(' (')[0].replace(/\s+/g,'');
  const result = String(getV('diag_result','')).replace(/\s+/g,'');
  const fromAi = result ? all.filter(i=>result.indexOf(key(i))>-1 && fresh(i)) : [];
  const lv = aiLevel(done), next = lv < 4 ? AI_LEVELS[lv] : null;
  const fromLevel = next ? next.items.filter(fresh) : [];
  const rec = fromAi.length ? fromAi : fromLevel;
  const why = fromAi.length ? 'AI 진단 결과에 나온 항목' : (next ? '다음 레벨('+lvLabel(next.lv)+')까지 남은 항목' : '');
  let html = '<div class="lvrec"><div class="lvrec-head"><b>추천</b> <span>'+esc(why || '추천할 항목이 없어요')+'</span>'+
    '<button type="button" class="linkbtn" data-action="lp-refresh">추천 새로고침</button></div>';
  if(rec.length){
    html += '<div class="lvrec-items">'+rec.map(i=>'<span class="lvrec-chip">'+esc(i)+'</span>').join('')+'</div>'+
      '<button type="button" class="addbtn" data-action="lp-add" data-target="'+esc(rec.join('|'))+'">추천 항목 계획에 담기</button>';
  }
  if(!result) html += '<div class="fhint" style="margin-top:6px">AI 진단 결과를 위에 붙여넣은 뒤 "추천 새로고침"을 누르면, 결과에 나온 역량으로 추천이 바뀝니다.</div>';
  return html + '</div>';
}

const GATE_CHAIN = ['s1','s3','verify','redefine','diag','s7','s9','s10','s11','s12','s13','s14','s15','s17'];
function isSectionLocked(sec){
  if(isAdmin) return false;
  const i = GATE_CHAIN.indexOf(sec.id);
  if(i<=0) return false;
  const prev = SECTIONS.find(s=>s.id===GATE_CHAIN[i-1]);
  const st = prev ? sectionStatus(prev) : null;
  return !st || st==='empty';
}

    delete saved.cur;
    state = Object.assign(state, saved);
    // 저장된 데이터에서도 cur 제거해서 다시 저장
    localStorage.setItem(STORE_KEY, JSON.stringify(saved));
  }
}catch(e){ /* storage unavailable */ }

let saveTimer=null;
function persist(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{
      // cur은 저장 안 함 — 항상 intro에서 시작해야 하므로
      const {cur: _skip, ...toSave} = state;
      localStorage.setItem(STORE_KEY, JSON.stringify(toSave));
      flashSaved();
    }catch(e){ /* ignore */ }
    syncToDb();
  }, 250);
}

async function loadRemote(){
  if(!docId) return;
  try{
    const res = await fetch('/api/submissions/'+encodeURIComponent(docId));
    if(res.status===404) return;
    if(!res.ok) return;
    const d = await res.json();
    if(d.fields && typeof d.fields==='object'){
      // 로컬에 있는 값을 서버가 덮어쓰지 않도록 merge (로컬 우선)
      state.fields = Object.assign({}, d.fields, state.fields);
    }
    state.locked = !!d.locked;
    state.completed = !!d.completed;
    gateReview = d.gateReview || null;
  }catch(e){ /* keep local */ }
}
function buildRemoteDoc(){
  const status = state.completed ? '완료' : (state.locked ? '저장됨' : '작성중');
  return {
    team: getV('s1_dept',''),
    name: (currentUser && (currentUser.nickname || currentUser.username)) || getV('s1_owner',''),
    fields: state.fields,
    locked: !!state.locked,
    completed: !!state.completed,
    status: status,
    updatedAt: new Date().toISOString(),
    filledCount: SECTIONS.filter(s=>!s.special && sectionFilled(s)).length,
    totalSections: TOTAL_SECTIONS,
    recommendedType: null
  };
}
function syncToDb(){
  if(!docId) return;
  dbWriteQueue = buildRemoteDoc();
  flushDbQueue();
}

async function flushDbQueue(){
  if(dbWriting || !dbWriteQueue) return;
  dbWriting = true;
  const data = dbWriteQueue; dbWriteQueue = null;
  try{
    // 로그인 상태면 user_id가 계속 붙어있도록 유저용 엔드포인트로 저장 (그래야 "내 씨앗 목록"/관리자 화면에 보임)
    const url = currentUser ? '/api/user/submissions/'+encodeURIComponent(docId) : '/api/submissions/'+encodeURIComponent(docId);
    const headers = currentUser ? _authHeaders() : {'Content-Type':'application/json'};
    await fetch(url, { method:'PUT', headers, body: JSON.stringify(data) });
  }catch(e){ /* stays saved locally regardless */ }
  dbWriting = false;
  if(dbWriteQueue) flushDbQueue();
}

function validatePassword(pw){
  // 비번 최소 규칙: 8자 이상, 영문+숫자 포함
  if(pw.length < 8) return '비밀번호는 8자 이상이어야 해요.';
  if(!/[a-zA-Z]/.test(pw)) return '영문자를 포함해야 해요.';
  if(!/[0-9]/.test(pw)) return '숫자를 포함해야 해요.';
  return '';
}

    html =
      '<h2 style="margin:0 0 4px;font-size:17px;">'+(isLogin?'로그인':'🥔 회원가입')+'</h2>'+
      '<p style="font-size:12px;color:var(--ink-soft);margin:0 0 18px;">'+
        (isLogin?'로그인하면 기기가 달라져도 씨앗이 유지돼요.':'아이디와 비밀번호를 설정해주세요.')+
      '</p>'+
      '<div class="field"><label>아이디</label><input type="text" id="authUsername" placeholder="영문 소문자·숫자·_ (예: gamja1)" autocomplete="username" maxlength="20" style="text-transform:lowercase;"></div>'+
      (isRegister?
        '<div class="field"><label>감자명 <span style="font-size:11px;color:var(--ink-soft);">비우면 자동 배정 🥔</span></label><input type="text" id="authNick" placeholder="비우면 랜덤 감자명 배정" maxlength="20"></div>'
        :'')+
      '<div class="field"><label>비밀번호'+(isLogin?'':' <span style="font-size:11px;color:var(--ink-soft);">8자 이상, 영문+숫자</span>')+'</label>'+
        '<input type="password" id="authPw" placeholder="••••••••" autocomplete="'+(isLogin?'current-password':'new-password')+'">'+
        (isRegister?'<div id="pwStrength" style="font-size:11px;margin-top:4px;height:14px;"></div>':'')+
      '</div>'+
      (isRegister?
        '<div class="field"><label>비밀번호 확인</label><input type="password" id="authPwConfirm" placeholder="동일하게 입력" autocomplete="new-password"></div>'
        :'')+
      '<div id="authErr" style="font-size:12px;color:var(--danger);margin-bottom:8px;display:none;"></div>'+
      '<button type="button" id="authSubmitBtn" style="width:100%;padding:10px;border-radius:8px;background:var(--blueprint);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;">'+(isLogin?'로그인':'가입하기')+'</button>'+
      '<div style="text-align:center;margin-top:12px;font-size:12px;color:var(--ink-soft);">'+
        (isLogin
          ? '계정이 없나요? <button type="button" onclick="openAuthModal(\'register\')" style="background:none;border:none;color:var(--blueprint);cursor:pointer;font-size:12px;">회원가입</button>'
          : '이미 있나요? <button type="button" onclick="openAuthModal(\'login\')" style="background:none;border:none;color:var(--blueprint);cursor:pointer;font-size:12px;">로그인</button>')+
      '</div>';
  }

  showModal(html);

  setTimeout(()=>{
    const btn = document.getElementById('authSubmitBtn');
    const errEl = document.getElementById('authErr');
    const showErr = msg => { if(errEl){ errEl.style.display=''; errEl.textContent=msg; } };
    const hideErr = () => { if(errEl){ errEl.style.display='none'; errEl.textContent=''; } };

    // 비번 강도 실시간 표시
    const pwNewEl = document.getElementById(isChangePw?'authPwNew':'authPw');
    const strEl = document.getElementById('pwStrength');
    if(pwNewEl && strEl && !isLogin){
      pwNewEl.addEventListener('input', ()=>{
        const v = pwNewEl.value;
        const err = validatePassword(v);
        if(!v){ strEl.textContent=''; strEl.style.color=''; return; }
        if(err){ strEl.textContent='⚠ '+err; strEl.style.color='var(--danger)'; }
        else if(v.length >= 12 && /[!@#$%^&*]/.test(v)){ strEl.textContent='✅ 강력한 비밀번호'; strEl.style.color='var(--ok)'; }
        else{ strEl.textContent='✅ 사용 가능'; strEl.style.color='var(--ok)'; }
      });
    }

    // 첫 필드 포커스
    const firstEl = document.getElementById(isChangePw?'authPwOld':'authUsername');
    if(firstEl) firstEl.focus();

    async function doAuth(){
      hideErr();
      if(isChangePw){
        const oldPw = (document.getElementById('authPwOld')?.value||'');
        const newPw = (document.getElementById('authPwNew')?.value||'');
        const confirmPw = (document.getElementById('authPwConfirm')?.value||'');
        const newNick = (document.getElementById('authPwNick')?.value||'').trim();
        if(!oldPw||!newPw||!confirmPw){ showErr('모든 항목을 입력해주세요.'); return; }
        const pwErr = validatePassword(newPw);
        if(pwErr){ showErr(pwErr); return; }
        if(newPw!==confirmPw){ showErr('새 비밀번호가 일치하지 않아요.'); return; }
        if(btn) btn.disabled=true;
        try{
          const token = localStorage.getItem('ddugi_token');
          const res = await fetch('/api/user/password',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(token||'')},body:JSON.stringify({old_password:oldPw,new_password:newPw,nickname:newNick})});
          const d = await res.json();
          if(!res.ok){ showErr(d.detail||'오류가 발생했어요.'); return; }
          if(currentUser) currentUser.nickname = d.nickname;
          forcedPwChange = false;
          hideModal();
          showModal('<div style="text-align:center;padding:20px 0;"><div style="font-size:32px;margin-bottom:8px;">🔒</div><h3 style="margin:0 0 6px;">비밀번호 변경 완료!</h3><button type="button" onclick="hideModal()" style="padding:8px 20px;border-radius:8px;background:var(--blueprint);color:#fff;border:none;font-size:13px;cursor:pointer;">확인</button></div>');
        }catch(e){ showErr('네트워크 오류. 다시 시도해주세요.'); }
        finally{ if(btn) btn.disabled=false; }
        return;
      }

      const username = (document.getElementById('authUsername')?.value||'').trim().toLowerCase();
      const pw = document.getElementById('authPw')?.value||'';
      if(!username||!pw){ showErr('아이디와 비밀번호를 입력해주세요.'); return; }

      if(isRegister){
        const pwErr = validatePassword(pw);
        if(pwErr){ showErr(pwErr); return; }
        const confirmPw = document.getElementById('authPwConfirm')?.value||'';
        if(pw!==confirmPw){ showErr('비밀번호가 일치하지 않아요.'); return; }
        const nick = document.getElementById('authNick')?.value||username;
        if(btn) btn.disabled=true;
        try{
          const res = await fetch('/api/user/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password:pw,nickname:nick})});
          const d = await res.json();
          if(!res.ok){ showErr(d.detail||'가입 오류가 발생했어요.'); return; }
          localStorage.setItem('ddugi_token', d.token);
          currentUser = d;
          updateAuthUI();
          hideModal();
          await syncSeedToServer();
          showModal('<div style="text-align:center;padding:8px 0;">'+
            '<div style="font-size:32px;margin-bottom:8px;">🥔</div>'+
            '<h3 style="margin:0 0 8px;">환영해요!</h3>'+
            '<p style="font-size:14px;color:var(--ink-soft);margin:0 0 16px;">배정된 감자명: <b style="color:var(--blueprint);">'+esc(d.nickname)+'</b><br><span style="font-size:12px;">마이페이지에서 바꿀 수 있어요</span></p>'+
            '<button type="button" onclick="hideModal()" style="padding:8px 24px;border-radius:8px;background:var(--blueprint);color:#fff;border:none;cursor:pointer;font-size:14px;">시작하기 🌱</button>'+
          '</div>');
         }catch(e){ showErr('네트워크 오류. 다시 시도해주세요.'); }
        finally{ if(btn) btn.disabled=false; }
        return;
      }

      // 로그인 — 일반 유저 먼저, 실패 시 관리자 계정 시도
      if(btn) btn.disabled=true;
      try{
        const res = await fetch('/api/user/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password:pw})});
        if(res.ok){
          const d = await res.json();
          localStorage.setItem('ddugi_token', d.token);
          currentUser = d;
          updateAuthUI();
          await syncSeedToServer();
          if(d.mustChangePassword){
            forcedPwChange = true;
            openAuthModal('change_pw');
            return;
          }
          hideModal();
          const welcomeNick = currentUser.nickname || username;
          showModal('<div style="text-align:center;padding:20px 0;"><div style="font-size:32px;margin-bottom:8px;">🥔</div><h3 style="margin:0 0 6px;">돌아오셨군요!</h3><p style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;">'+welcomeNick+'님 반가워요.</p><button type="button" onclick="hideModal()" style="padding:8px 20px;border-radius:8px;background:var(--blueprint);color:#fff;border:none;font-size:13px;cursor:pointer;">시작하기</button></div>');
        } else {
          // 일반 로그인 실패 → 관리자 계정 시도
          const adminRes = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({empId:username, code:pw})});
          if(adminRes.ok){
            const ad = await adminRes.json();
            localStorage.setItem('admin_token', ad.token);
            localStorage.setItem('admin_role', ad.role);
            localStorage.setItem('admin_emp_id', username);
            empId = username; role = ad.role; isAdmin = true; isMaster = ad.role==='master';
            updateAdminSlot();
            hideModal();
            renderSheet();
            showModal('<div style="text-align:center;padding:20px 0;"><div style="font-size:32px;margin-bottom:8px;">🥔</div><h3 style="margin:0 0 6px;">'+(isMaster?'마스터':'관리자')+' 로그인됐어요</h3><button type="button" onclick="hideModal()" style="padding:8px 20px;border-radius:8px;background:var(--blueprint);color:#fff;border:none;font-size:13px;cursor:pointer;">시작하기</button></div>');
          } else {
            const d = await res.json();
            showErr(d.detail||'아이디 또는 비밀번호가 틀렸어요.');
          }
        }
      }catch(e){ showErr('네트워크 오류. 다시 시도해주세요.'); }
      finally{ if(btn) btn.disabled=false; }
    }

    if(btn) btn.onclick = doAuth;
    ['authUsername','authPw','authPwConfirm','authNick','authInvite','authPwOld','authPwNew','authPwNick'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter') doAuth(); });
    });
  }, 50);
}


function userLogout(){
  localStorage.removeItem('ddugi_token');
  currentUser = null;
  updateAuthUI();
}

function goToConv(){
  onboardingMetaTab = 'conv';
  convVersion = null;
  convStep = 0;
  goto('example');
}

// 서버의 로그인/권한 확인 결과(403/429)를 안내 문구로
async function adminErrorText(res){
  let d = {};
  try{ d = (await res.json()).detail || {}; }catch(e){}
  if(res.status===429){
    const sec = d.locked_seconds || 300;
    return '5회 이상 틀려서 잠겼어요. '+Math.floor(sec/60)+'분 '+(sec%60)+'초 후에 다시 시도하세요.';
  }
  if(res.status===403){
    if(typeof d==='string') return d;  // 비밀번호는 맞지만 이 화면 권한이 없는 경우
    return '아이디 또는 비밀번호가 올바르지 않아요.'+(d.remaining ? ' (남은 시도 '+d.remaining+'회)' : '');
  }
  if(res.status===400 && typeof d==='string') return d;
  return '처리하지 못했어요. (HTTP '+res.status+')';
}

  fetch('/api/auth/login', {

/* ============== field rendering ============== */
function fieldWrap(inner, field, extraClass){
  return '<div class="field '+(extraClass||'')+'">' + inner + '</div>';
}

function renderField(f){
  switch(f.type){
    case 'hint': return '<div class="hint">'+esc(f.text)+'</div>';
    case 'subhead': return '<h3 class="fieldgroup">'+esc(f.text)+'</h3>';
    case 'diffhint': return diffHintHtml(f.sectionId);
    case 'static': return '<div class="field"><label>'+esc(f.label)+'</label><div class="staticval">'+esc(f.value)+'</div></div>';
    case 'text': return fieldWrap(
      '<label for="'+f.id+'">'+esc(f.label)+(f.required?' <span class="req">*</span>':'')+'</label>'+
      '<input type="text" id="'+f.id+'" data-bind="'+f.id+'" placeholder="'+esc(f.ph)+'" value="'+esc(getV(f.id,''))+'">'
    , f);
    case 'textarea': return fieldWrap(
      '<label for="'+f.id+'">'+esc(f.label)+(f.required?' <span class="req">*</span>':'')+'</label>'+
      '<textarea id="'+f.id+'" data-bind="'+f.id+'" placeholder="'+esc(getV(f.id+'_hint','')||f.ph)+'">'+esc(getV(f.id,''))+'</textarea>'
    , f);
    case 'row': return '<div class="row-fields">' + f.children.map(renderField).join('') + '</div>';
    case 'checklist': return renderChecklist(f);
    case 'radio': return renderRadio(f);
    case 'ftable': return renderFTable(f);
    case 'dtable': return '<div class="field"><label>'+esc(f.label)+'</label><div id="fbody-'+f.id+'">'+renderDTableBody(f)+'</div></div>';
    case 'dlist': return '<div class="field"><label>'+esc(f.label)+'</label><div id="fbody-'+f.id+'">'+renderDListBody(f)+'</div></div>';
    case 'repeat': return '<div class="field"><label>'+esc(f.label)+'</label>'+(f.lvFilter ? toolNoteHtml() : '')+'<div id="fbody-'+f.id+'">'+renderRepeatBody(f)+'</div></div>';
    case 'designreview': return renderDesignReview();
    case 'datacandidates': return renderDataCandidates();
    case 'codetest': return renderCodeTest();
    case 'glossary07': return glossary07Html();
    case 'example05': return example05Html();
    case 'check17': return renderCheck17(f);
    case 'lptable': return renderLpTable(f);
    case 'lpresult': return lpResultHtml();
    case 'ailevel': return aiLevelCardHtml(true);
    case 'redefref': return redefRefHtml();
    case 'gate': return gateHtml();
    default: return '';
  }
}

function checklistOpts(f){
  const opts = f.optsFn ? f.optsFn() : f.opts;
  if(!f.lvFilter) return opts;
  const val = getV(f.id, []);
  return opts.filter(o=>toolShown(o, val.indexOf(o)>-1));
}
function renderChecklist(f){
  const val = getV(f.id, []);
  const opts = checklistOpts(f).map(o=>{
    const checked = val.indexOf(o) > -1;
    return '<label class="opt'+(checked?' checked':'')+'"><input type="checkbox" data-checklist="'+f.id+'" data-opt="'+esc(o)+'" '+(checked?'checked':'')+'>'+esc(o)+'</label>';
  }).join('');
  let otherHtml='';
  // 보기에 '기타'가 있으면 체크했을 때만 입력칸 표시
  const hasEtc = checklistOpts(f).indexOf('기타') > -1;
  if(f.other && (!hasEtc || val.indexOf('기타') > -1)){
    otherHtml = '<input type="text" class="opt-other" data-bind="'+f.id+'_other" placeholder="기타 입력" value="'+esc(getV(f.id+'_other',''))+'">';
  }
  return '<div class="field"><label>'+esc(f.label)+'</label>'+(f.lvFilter ? toolNoteHtml() : '')+'<div class="opts">'+opts+'</div>'+otherHtml+'</div>';
}

function renderRadio(f){
  const val = getV(f.id, '');
  const optList = f.optsFn ? f.optsFn() : f.opts;
  const opts = optList.map(o=>{
    const checked = val===o;
    return '<label class="opt'+(checked?' checked':'')+'"><input type="radio" name="'+f.id+'" data-radio="'+f.id+'" data-opt="'+esc(o)+'" '+(checked?'checked':'')+'>'+esc(o)+'</label>';
  }).join('');
  return '<div class="field"><label>'+esc(f.label)+'</label><div class="opts">'+opts+'</div></div>';
}

function renderFTable(f){
  const val = getV(f.id, {});
  let head = '<tr><th>구분</th>'+f.cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
  let rows = f.rows.map(r=>{
    const rowVal = val[r] || {};
    const off = f.check && !rowVal._on;
    const ph = f.ph ? f.ph[r] : undefined;
    const cells = f.cols.map(c=>{
      if(ph===null) return '<td></td>';
      const v = rowVal[c]||'';
      const hint = ph || '';
      return '<td><input type="text" data-ftable="'+f.id+'" data-row="'+esc(r)+'" data-col="'+esc(c)+'" value="'+esc(v)+'"'+(hint?' placeholder="'+esc(hint)+'"':'')+'></td>';
    }).join('');
    const label = f.check
      ? '<label class="ftcheck"><input type="checkbox" data-ftcheck="'+f.id+'" data-row="'+esc(r)+'"'+(off?'':' checked')+'>'+esc(r)+'</label>'
      : esc(r);
    return '<tr'+(off?' class="off"':'')+'><td class="rowlabel">'+label+'</td>'+cells+'</tr>';
  }).join('');

function sectionFilled(sec){
  if(sec.special) return false;
  return sec.fields.some(f=>fieldHasValue(f));
}
function sectionStatus(sec){
  if(sec.disabled) return null;
  if(sec.id==='discover') return String(getV('discover_chosen','')).trim() ? 'done' : (String(getV('discover_input','')).trim() ? 'partial' : 'empty');
  if(sec.id==='verify') return String(getV('verify_result','')).trim() ? 'done' : 'empty';
  if(sec.id==='diag') return String(getV('diag_result','')).trim() ? 'done' : 'empty';
  if(sec.special || !sec.fields) return null;
  const req = sec.fields.filter(f=>f.required);
  if(!sec.fields.some(fieldHasValue)) return 'empty';
  // required 필드가 있으면 그걸로 판단, 없으면 하나라도 채워지면 done
  if(req.length) return req.every(fieldHasValue) ? 'done' : 'partial';
  return sec.fields.filter(f=>!f.type||!['hint','static','diffhint','subhead','ailevel','lpresult','redefref','gate'].includes(f.type)).every(fieldHasValue) ? 'done' : 'partial';
}
function fieldHasValue(f){
  if(f.type==='hint' || f.type==='static' || f.type==='diffhint' || f.type==='designreview' || f.type==='datacandidates' || f.type==='codetest' || f.type==='glossary07' || f.type==='example05' || f.type==='subhead') return false;
  if(f.type==='row') return f.children.some(fieldHasValue);
  if(f.type==='check17') return f.groups.some(g=>g.items.some(it=>getV('ck_'+it.id,false)));
  if(f.type==='lptable') return getV(f.store,[]).length>0;
  if(f.type==='ailevel' || f.type==='lpresult' || f.type==='redefref' || f.type==='gate') return false;
  const v = getV(f.id, f.type==='checklist'?[]:(f.type==='dtable'||f.type==='dlist'||f.type==='repeat')?[]:(f.type==='ftable')?{}:'');
  if(Array.isArray(v)){
    if(f.type==='dtable' || f.type==='repeat') return v.some(row=>Object.values(row).some(x=>String(x||'').trim()));
    if(f.type==='dlist') return v.some(x=>String(x||'').trim());
    return v.length>0;
  }
  if(typeof v==='object' && v) return Object.values(v).some(row=>Object.values(row).some(x=>String(x||'').trim()));
  return String(v||'').trim().length>0;
}

}

// 작성자(이름) 기준으로 하나만: 이름이 있으면 그 이름의 가장 최근 것만 남기고,
// 이름이 비어 있으면(로그인 안 한 경우) 같은 IP끼리만 묶고, IP도 없으면 문서(docId)별로 각각 둠
function dedupeByAuthor(list){
  const groups = {};
  list.forEach(v=>{
    const key = String(v.name||'').trim() || (v.ip ? '__ip__'+v.ip : '__doc__'+v.docId);
    (groups[key] = groups[key]||[]).push(v);
  });
  return Object.values(groups).map(arr=>{
    arr.sort((a,b)=>String(b.updatedAt||'').localeCompare(a.updatedAt||''));
    return Object.assign({}, arr[0], {_extraCount: arr.length-1});
  });
}
function renderTaskListBody(){
  const body = document.getElementById('taskListBody'), sum = document.getElementById('taskListSummary');
  if(!body) return;
  const qq = ((document.getElementById('taskListSearch')||{}).value||'').trim().toLowerCase();
  const stageF = (document.getElementById('taskListStage')||{}).value||'';
  const sortBy = (document.getElementById('taskListSort')||{}).value||'updated';
  let rows = dedupeByAuthor(taskListData).map(v=>Object.assign({}, v, {stageIdx: taskStageIdx(v)}));
  // 요약은 단계별 인원 수를 그대로 센 것 (가중치나 추정치 없음)
  const counts = TASK_STAGE_LABELS.map((l,i)=>rows.filter(r=>r.stageIdx===i).length);
  sum.innerHTML = rows.length ? '<div class="lvcard"><div class="lvnow">완료 <b>'+counts[4]+'</b> / 전체 <b>'+rows.length+'</b> <span>('+Math.round(100*counts[4]/rows.length)+'%)</span></div>'+
    '<div class="lvnext">'+TASK_STAGE_LABELS.map((l,i)=>esc(l)+' '+counts[i]+'명').join(' · ')+'</div></div>' : '';
  if(qq) rows = rows.filter(r=>[r.team, r.name, r.ip, (r.task||{}).name].some(x=>String(x||'').toLowerCase().indexOf(qq)>-1));
  if(stageF!=='') rows = rows.filter(r=>r.stageIdx===+stageF);
  if(sortBy==='stage') rows.sort((a,b)=>a.stageIdx-b.stageIdx || String((b.updatedAt||'')).localeCompare(a.updatedAt||''));
  else if(sortBy==='name') rows.sort((a,b)=>String((a.task||{}).name||'').localeCompare(String((b.task||{}).name||''),'ko'));
  else rows.sort((a,b)=>String(b.updatedAt||'').localeCompare(a.updatedAt||''));
  if(!taskListData.length){ body.innerHTML = '<div class="hint">아직 제출된 씨앗이 없어요.</div>'; return; }
  if(!rows.length){ body.innerHTML = '<div class="hint">조건에 맞는 씨앗이 없어요.</div>'; return; }
  const trs = rows.map(v=>{
    const t = v.task||{};
    const when = v.updatedAt ? new Date(v.updatedAt).toLocaleString('ko-KR') : '-';
    const learn = lvLabel(aiLevel(v.lpDone||[]));
    const rec = v.gateReview && v.gateReview.decision==='인정' ? lvLabel(gateLevelNum(v.gateReview.level)) : '없음';
    const extra = v._extraCount>0 ? '<br><small>(그 외 '+v._extraCount+'건 더 있음)</small>' : '';
    return '<tr><td>'+esc(t.name||'(제목 없음)')+'</td><td>'+esc(v.team||'-')+' · '+esc(v.name||'-')+extra+'</td>'+
      '<td>'+esc(v.ip||'-')+'</td>'+
      '<td>'+esc(t.cat||'-')+(t.target&&t.target.length ? '<br><small>'+esc(t.target.join(', '))+'</small>' : '')+'</td>'+
      '<td>'+esc(TASK_STAGE_LABELS[v.stageIdx])+'</td><td>'+esc(learn)+'</td><td>'+esc(rec)+'</td><td>'+esc(when)+'</td>'+
      '<td><button type="button" class="chip-btn" data-action="submission-delete" data-target="'+esc(v.docId)+'">삭제</button></td></tr>';
  }).join('');
  body.innerHTML = '<table class="dtable"><thead><tr><th>씨앗 이름</th><th>부서·담당자</th><th>IP</th><th>카테고리·대상</th><th>진행 단계</th><th>학습 레벨</th><th>인정 레벨</th><th>마지막 저장</th><th></th></tr></thead><tbody>'+trs+'</tbody></table>';
}

async function renderVisitsData(){
  const cards = document.getElementById('visitsCards');
  const chart = document.getElementById('visitsChart');
  const body = document.getElementById('visitsBody');
  if(!body) return;
  body.innerHTML = '<div class="hint">불러오는 중…</div>';
  try{
    const res = await fetch('/api/visits/stats', {headers: authHeaders()});
    if(res.status===403 || res.status===429){
      const text = await adminErrorText(res);
      if(res.status===403){
        doAdminLogout(); showModal(adminModalHtml());
        document.getElementById('adminErr').textContent = '다시 로그인해주세요.';
        return;
      }
      body.innerHTML = '<div class="hint">'+esc(text)+'</div>'; return;
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d = await res.json();
    // 카드
    const card = (label,val) => '<div class="lvcard" style="flex:1;min-width:140px;margin:0"><div class="lvnow" style="font-size:13px">'+esc(label)+'</div><div style="font-size:28px;font-weight:700;color:var(--blueprint)">'+esc(String(val))+'</div></div>';
    cards.innerHTML = card('전체 방문',d.total_visits)+card('순 방문자(IP)',d.unique_ips)+card('오늘 방문',d.today_visits)+card('오늘 순 방문자',d.today_unique);
    // 바 차트
    if(d.by_date && d.by_date.length){
      const maxCnt = Math.max(1, ...d.by_date.map(r=>r.cnt));
      chart.innerHTML = d.by_date.map(r=>{
        const h = Math.max(4, Math.round(110*r.cnt/maxCnt));
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;min-width:0" title="'+esc(r.date+': '+r.cnt+'건')+'">'+
          '<div style="width:100%;max-width:24px;height:'+h+'px;background:var(--blueprint-2);border-radius:3px 3px 0 0"></div>'+
          '<div style="font-size:9px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">'+esc(r.date.slice(5))+'</div></div>';
      }).join('');
    } else {
      chart.innerHTML = '<div class="hint">데이터가 없어요.</div>';
    }
    // 테이블
    if(!d.recent || !d.recent.length){
      body.innerHTML = '<div class="hint">아직 방문 기록이 없어요.</div>';
    } else {
      const parseUA = ua => {
        if(!ua) return '-';
        if(ua.indexOf('Chrome')>-1 && ua.indexOf('Edg')>-1) return 'Edge';
        if(ua.indexOf('Chrome')>-1) return 'Chrome';
        if(ua.indexOf('Firefox')>-1) return 'Firefox';
        if(ua.indexOf('Safari')>-1) return 'Safari';
        return ua.length>40 ? ua.slice(0,40)+'…' : ua;
      };
      const rows = d.recent.map(r=>{
        const when = r.visited_at ? new Date(r.visited_at+'Z').toLocaleString('ko-KR') : '-';
        return '<tr><td>'+esc(r.ip||'-')+'</td><td>'+esc(parseUA(r.user_agent))+'</td><td>'+esc(r.path||'/')+'</td><td>'+esc(when)+'</td></tr>';
      }).join('');
      body.innerHTML = '<table class="dtable"><thead><tr><th>IP</th><th>브라우저</th><th>경로</th><th>시간</th></tr></thead><tbody>'+rows+'</tbody></table>';
    }
  }catch(e){
    body.innerHTML = '<div class="hint">불러오기에 실패했어요: '+esc((e&&e.message)||'')+'</div>';
  }
}

function saveTaxonomy(key){
  const ta = document.getElementById('tax_'+key), msg = document.getElementById('taxMsg_'+key);
  let value;
  if(key==='intro_html'){
    value = ta.value.trim();
  } else {
  const lines = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(key==='categories'){
    value = {};
    lines.forEach((line,i)=>{
      const p = line.indexOf(':');
      if(p<0) return;
      const name = line.slice(0,p).trim().replace(/^[①-⑩]\s*/, '');
      const subs = line.slice(p+1).split(',').map(x=>x.trim()).filter(Boolean);
      if(name) value[String.fromCodePoint(0x2460+i)+' '+name] = subs;
    });
    if(!Object.keys(value).length){ msg.style.color='var(--danger)'; msg.textContent='형식을 확인하세요 (카테고리명: 세부목적1, 세부목적2).'; return; }
  } else {
    value = lines;
    if(!value.length){ msg.style.color='var(--danger)'; msg.textContent='최소 1개는 있어야 해요.'; return; }
  }
  }
  fetch('/api/admin/taxonomy/'+key, {method:'PUT', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({value})})
    .then(async r=>{
      if(r.ok){ msg.style.color='var(--ok)'; msg.textContent='저장했어요.'; if(key==='intro_html') introEditing=false; setTimeout(loadTaxonomy, 900); }
      else{ msg.style.color='var(--danger)'; msg.textContent = await adminErrorText(r); }
    }).catch(()=>{ msg.style.color='var(--danger)'; msg.textContent='서버에 연결할 수 없어요.'; });
}

  if(el) el.innerHTML = '<div style="font-size:12px;color:var(--ink-soft);">생성 중…</div>';
  try{
    const res = await fetch('/api/admin/invite-package', {method:'POST', headers: authHeaders()});
    const d = await res.json();
    if(!res.ok){ if(el) el.textContent = '오류: '+(d.detail||'실패'); return; }
    const msg = `안녕하세요! 감자밭 초대드려요 🥔

🌱 씨앗 정의서 (회원가입 필요)
${d.gamja99_url}
초대코드: ${d.code}
(24시간 내 사용, 1회용)

${d.discord_invite ? '💬 감자밭 Discord\n'+d.discord_invite : '💬 Discord 초대링크는 별도 안내드릴게요!'}`;
    if(el) el.innerHTML =
      '<div style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;">'+
        '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;">'+
          '<div style="flex:1;min-width:160px;">'+
            '<div style="font-size:11px;color:var(--ink-soft);margin-bottom:3px;">gamja99 초대코드</div>'+
            '<div style="font-size:16px;font-weight:700;letter-spacing:2px;color:var(--ok);">'+esc(d.code)+'</div>'+
            '<div style="font-size:11px;color:var(--ink-soft);">만료: '+esc(d.expires_at.slice(0,16))+'</div>'+
          '</div>'+
          (d.discord_invite ? '<div style="flex:1;min-width:160px;"><div style="font-size:11px;color:var(--ink-soft);margin-bottom:3px;">Discord 초대링크</div><div style="font-size:12px;color:var(--blueprint);word-break:break-all;">'+esc(d.discord_invite)+'</div></div>' : '')+
        '</div>'+
        '<div style="background:var(--paper);border:1px solid var(--line-soft);border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap;line-height:1.7;color:var(--ink);">'+esc(msg)+'</div>'+
        '<div style="margin-top:10px;display:flex;gap:8px;">'+
          '<button type="button" onclick="navigator.clipboard.writeText('+JSON.stringify(msg)+').then(()=>{this.textContent=\'✅ 복사됨\';setTimeout(()=>this.textContent=\'📋 카톡 메시지 복사\',2000)})" style="padding:7px 14px;border-radius:8px;background:var(--blueprint);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;">📋 카톡 메시지 복사</button>'+
          '<button type="button" onclick="navigator.clipboard.writeText(\''+esc(d.code)+'\').then(()=>{this.textContent=\'✅\';setTimeout(()=>this.textContent=\'코드만 복사\',1500)})" style="padding:7px 12px;border-radius:8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);font-size:12px;cursor:pointer;">코드만 복사</button>'+
        '</div>'+
      '</div>';
    loadInviteCodes();
  }catch(e){ if(el) el.textContent = '네트워크 오류'; }
}

async function loadSettings(){
  try{
    const res = await fetch('/api/admin/settings', {headers: authHeaders()});
    if(!res.ok) return;
    const d = await res.json();
    const u = document.getElementById('settingGameja99Url');
    const di = document.getElementById('settingDiscordInvite');
    if(u) u.value = d.gamja99_url || '';
    if(di) di.value = d.discord_invite || '';
  }catch(e){}
}

async function saveSettings(){
  const u = document.getElementById('settingGameja99Url');
  const di = document.getElementById('settingDiscordInvite');
  const msg = document.getElementById('settingsSaveMsg');
  const body = {};
  if(u && u.value.trim()) body.gamja99_url = u.value.trim();
  if(di) body.discord_invite = di.value.trim();
  try{
    const res = await fetch('/api/admin/settings', {method:'PUT', headers:{...authHeaders(),'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if(res.ok){
      if(msg){ msg.style.display=''; msg.textContent='✅ 저장됐어요!'; setTimeout(()=>msg.style.display='none',2000); }
    } else {
      if(msg){ msg.style.display=''; msg.style.color='#ef4444'; msg.textContent='저장 실패'; }
    }
  }catch(e){ if(msg){ msg.style.display=''; msg.textContent='오류'; } }
}

async function loadInviteCodes(){
  const el = document.getElementById('inviteCodeList');
  if(!el) return;
  try{
    const res = await fetch('/api/admin/invites', {headers: authHeaders()});
    if(!res.ok){ el.textContent = '불러오기 실패'; return; }
    const list = await res.json();
    if(!list.length){ el.textContent = '아직 생성된 코드가 없어요.'; return; }
    const statusColor = s => s==='유효'?'var(--ok)':s==='사용됨'?'var(--ink-soft)':'#ef4444';
    const statusBg = s => s==='유효'?'var(--ok-soft)':s==='사용됨'?'var(--panel)':'rgba(239,68,68,.1)';
    el.innerHTML = '<table style="width:100%;border-collapse:collapse;">'+
      '<tr style="font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--line-soft);">'+
        '<th style="text-align:left;padding:4px 8px;">코드</th>'+
        '<th style="text-align:left;padding:4px 8px;">상태</th>'+
        '<th style="text-align:left;padding:4px 8px;">만료</th>'+
        '<th style="text-align:left;padding:4px 8px;">사용자</th>'+
      '</tr>'+
      list.map(c =>
        '<tr style="border-bottom:1px solid var(--line-soft);">'+
          '<td style="padding:6px 8px;font-size:12px;font-weight:600;letter-spacing:1px;color:'+statusColor(c.status)+';">'+esc(c.code)+'</td>'+
          '<td style="padding:6px 8px;"><span style="padding:3px 10px;border-radius:999px;font-size:11px;background:'+statusBg(c.status)+';color:'+statusColor(c.status)+';">'+esc(c.status)+'</span></td>'+
          '<td style="padding:6px 8px;font-size:12px;color:var(--ink-soft);">'+(c.expires_at?c.expires_at.slice(0,16):'-')+'</td>'+
          '<td style="padding:6px 8px;font-size:12px;color:var(--ink-soft);">'+esc(c.used_by||'-')+'</td>'+
        '</tr>'
      ).join('')+
    '</table>';
  }catch(e){ el.textContent = '오류: '+e.message; }
}

async function renderDashboard(){
  const out = document.getElementById('dashboardBody');
  if(!out) return;
  out.innerHTML = '<div class="hint">불러오는 중…</div>';
  try{
    const res = await fetch('/api/submissions', {headers: authHeaders()});
    if(res.status===403 || res.status===429){
      const text = await adminErrorText(res);
      if(res.status===403){
        // 저장된 비밀번호가 바뀐 경우: 로그아웃하고 로그인 창으로 (계속 틀린 요청을 보내 잠기지 않도록)
        doAdminLogout();
        showModal(adminModalHtml());
        document.getElementById('adminErr').textContent = '비밀번호가 바뀌었어요. 다시 로그인해주세요.';
        return;
      }
      out.innerHTML = '<div class="hint">'+esc(text)+'</div>';
      return;
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw = await res.json();
    if(!raw.length){ out.innerHTML = '<div class="hint">아직 제출된 내용이 없어요.</div>'; return; }
    const list = dedupeByAuthor(raw);  // 작성자(이름) 기준 하나만
    const doneN = list.filter(v=>(v.status||'작성중')==='완료').length;
    const savedN = list.filter(v=>(v.status||'작성중')==='저장됨').length;
    const wipN = list.length - doneN - savedN;
    const bar = (n,cls) => n ? '<span class="dashbar-seg '+cls+'" style="width:'+(100*n/list.length)+'%"></span>' : '';

    // 섹션 진행 단계 레이블 (채워진 비율 기준)
    const STAGE_LABELS = [
      {max:0,   label:'미시작',      color:'var(--ink-soft)'},
      {max:20,  label:'🌱 시작',     color:'#94a3b8'},
      {max:40,  label:'📝 초반',     color:'var(--blueprint)'},
      {max:70,  label:'🔥 진행 중',  color:'#f59e0b'},
      {max:99,  label:'🏁 마무리',   color:'#10b981'},
      {max:100, label:'✅ 완료',     color:'var(--ok)'},
    ];
    function stageLabel(pct){
      const s = STAGE_LABELS.find(l=>pct<=l.max) || STAGE_LABELS[STAGE_LABELS.length-1];
      return '<span style="color:'+s.color+';font-weight:600;">'+s.label+'</span>';
    }

    // 섹션별 진행 현황 막대
    function miniBar(filled, total){
      if(!total) return '-';
      const pct = Math.round(100*filled/total);
      return '<div style="display:flex;align-items:center;gap:6px;">'+
        '<div style="width:80px;height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;">'+
          '<div style="width:'+pct+'%;height:100%;background:var(--blueprint);border-radius:3px;transition:width .3s;"></div>'+
        '</div>'+
        '<span style="font-size:11px;color:var(--ink-soft);">'+filled+'/'+total+'</span>'+
      '</div>';
    }

    const rows = list.map(v=>{
      const total = v.totalSections || TOTAL_SECTIONS;
      const filled = v.filledCount || 0;
      const pct = total ? Math.round(100*filled/total) : 0;
      const when = v.updatedAt ? new Date(v.updatedAt).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';
      const status = v.status || '작성중';
      const statusBadge = status==='완료'
        ? '<span style="padding:3px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-size:11px;">✅ 완료</span>'
        : status==='저장됨'
        ? '<span style="padding:3px 10px;border-radius:999px;background:var(--panel);color:var(--ink-soft);font-size:11px;">🔒 저장됨</span>'
        : '<span style="padding:3px 10px;border-radius:999px;background:var(--blueprint-soft);color:var(--blueprint);font-size:11px;">✏️ 작성중</span>';
      const seedName = v.task && v.task.seedName ? esc(v.task.seedName) : (v.name ? esc(v.name) : '<span style="color:var(--ink-soft);">미입력</span>');
      const rec = v.gateReview && v.gateReview.decision==='인정' ? lvLabel(gateLevelNum(v.gateReview.level)) : '-';
      const idCell = v.username ? '👤 '+esc(v.username) : '<span style="color:var(--ink-soft);">계정 없음</span>';
      return '<tr>'+
        '<td style="font-weight:600;">'+seedName+'</td>'+
        '<td>'+statusBadge+'</td>'+
        '<td>'+miniBar(filled, total)+'</td>'+
        '<td>'+stageLabel(status==='완료'?100:pct)+'</td>'+
        '<td style="font-size:11px;">'+idCell+'<br><span style="color:var(--ink-soft);">'+esc(v.ip||'-')+'</span></td>'+
        '<td style="font-size:11px;color:var(--ink-soft);">'+esc(when)+'</td>'+
        '<td style="font-size:11px;color:var(--ink-soft);">'+esc(rec)+'</td>'+
      '</tr>';
    }).join('');

    const reqs = list.filter(v=>v.gate && v.gate.level && v.gate.aiResult);
    const gateRows = reqs.map(v=>{
      const g = v.gate, r = v.gateReview && v.gateReview.level===g.level ? v.gateReview : null;
      const t = esc(v.docId+'|'+g.level);
      return '<tr><td>'+esc(v.name||'-')+'</td><td>'+esc(g.task||'-')+'</td><td>'+esc(g.level)+'</td><td>'+esc(gateAiVerdict(g.aiResult)||'형식 확인 필요')+'</td>'+
        '<td>'+(r ? esc(r.decision)+(r.note ? '<br><small>'+esc(r.note)+'</small>' : '') : '대기')+'</td>'+
        '<td><button type="button" class="chip-btn" data-action="gate-ok" data-target="'+t+'">인정</button> '+
        '<button type="button" class="chip-btn" data-action="gate-fix" data-target="'+t+'">보완 요청</button></td></tr>'+
        '<tr><td colspan="6"><details><summary>결과물과 AI 1차 판정 보기</summary>'+
        '<div class="fhint" style="margin-top:8px"><b>결과물 (작성자)</b></div><pre class="gloss-code">'+esc(g.evidence||'(미작성)')+'</pre>'+
        '<div class="fhint"><b>AI 1차 판정 (AI 작성)</b></div><pre class="gloss-code">'+esc(g.aiResult)+'</pre></details></td></tr>';
    }).join('');
    const gateWaitN = reqs.filter(v=>!(v.gateReview && v.gateReview.level===v.gate.level)).length;
    out.innerHTML =
      '<div class="lvcard">'+
        '<div class="lvnow">등록된 씨앗 <b>'+list.length+'</b>개'+(gateWaitN ? ' <span>· Gate 확인 대기 '+gateWaitN+'건</span>' : '')+'</div>'+
        '<div class="dashbar">'+bar(doneN,'done')+bar(savedN,'saved')+bar(wipN,'wip')+'</div>'+
        '<div class="lvnext">✅ 완료 '+doneN+' · 🔒 저장됨 '+savedN+' · ✏️ 작성중 '+wipN+'</div>'+
      '</div>'+
      (reqs.length ?
        '<h3 style="margin:16px 0 8px">Gate 확인 요청</h3>'+
        '<div class="hint">결과물이 Gate 질문을 충족하는지 직접 확인하고 인정하세요.</div>'+
        '<table class="dtable"><thead><tr><th>이름</th><th>씨앗</th><th>신청 레벨</th><th>AI 1차</th><th>관리자 확인</th><th></th></tr></thead><tbody>'+gateRows+'</tbody></table>'
        : '')+
      '<h3 style="margin:16px 0 8px">씨앗 진행 현황</h3>'+
      '<table class="dtable"><thead><tr>'+
        '<th>씨앗 이름</th><th>상태</th><th>입력 현황</th><th>단계</th><th>아이디/IP</th><th>마지막 저장</th><th>인정 레벨</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table>';
  }catch(e){
    out.innerHTML = '<div class="hint">불러오기에 실패했어요: '+esc((e&&e.message)||'')+'</div>';
  }
}

function navFootHtml(sec){
  const idx = SECTIONS.findIndex(s=>s.id===sec.id);
  let pi = idx-1; while(pi>=0 && SECTIONS[pi].disabled && !isAdmin) pi--;
  let ni = idx+1; while(ni<SECTIONS.length && SECTIONS[ni].disabled && !isAdmin) ni++;
  const prev = SECTIONS[pi];
  const next = SECTIONS[ni];

  // 저장/수정 버튼 — 작성 섹션(special 없는 것)에만
  let saveHtml = '';
  if(!sec.special){
    if(state.completed){
      // 완료 상태: 저장(비활성) + 수정
      saveHtml =
        '<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">'+
          '<button type="button" disabled style="padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:not-allowed;opacity:0.45;">💾 저장</button>'+
          '<button type="button" onclick="openUnlockModal()" style="padding:8px 18px;border-radius:8px;border:1px solid var(--blueprint);background:var(--paper);color:var(--blueprint);font-size:13px;font-weight:600;cursor:pointer;">✎ 수정</button>'+
          '<span style="font-size:12px;color:var(--ok);">✅ 완료됨</span>'+
        '</div>';
    } else if(state.locked){
      // 저장됨 상태: 저장(비활성) + 수정
      saveHtml =
        '<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">'+
          '<button type="button" disabled style="padding:8px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:not-allowed;opacity:0.45;">💾 저장</button>'+
          '<button type="button" onclick="openUnlockModal()" style="padding:8px 18px;border-radius:8px;border:1px solid var(--blueprint);background:var(--paper);color:var(--blueprint);font-size:13px;font-weight:600;cursor:pointer;">✎ 수정</button>'+
          '<span style="font-size:12px;color:var(--ink-soft);">🔒 저장됨</span>'+
        '</div>';
    } else {
      // 작성 중: 저장(활성)
      saveHtml =
        '<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">'+
          '<button type="button" onclick="showModal(window._saveConfirmHtml())" style="padding:8px 18px;border-radius:8px;border:none;background:var(--blueprint);color:#fff;font-size:13px;font-weight:600;cursor:pointer;">💾 저장</button>'+
          '<span style="font-size:12px;color:var(--ink-soft);">저장하면 잠기고, 수정 버튼으로 다시 열 수 있어요</span>'+
        '</div>';
    }
  }

  return saveHtml+
    '<div class="navfoot">'+
    '<button type="button" data-action="goto" data-target="'+(prev?prev.id:'')+'" '+(prev?'':'disabled')+'>'+
      (prev ? '← '+esc(prev.num+' · '+prev.title) : '← 이전')+'</button>'+
    '<button type="button" data-action="goto" data-target="'+(next?next.id:'')+'" '+(next?'':'disabled')+'>'+
      (next ? esc(next.num+' · '+next.title)+' →' : '다음 →')+'</button>'+
  '</div>';
}

/* toggleNavGroup 제거 — <details> 로 대체됨 */

function updateRulerAndNav(){
  const relevant = SECTIONS.filter(s=>!s.special && !s.disabled);
  const total = relevant.length;
  const filledCount = relevant.filter(sectionFilled).length;
  document.getElementById('progressText').textContent = filledCount+' / '+total+' 섹션 작성됨';
  const ruler = document.getElementById('ruler');
  ruler.innerHTML = relevant.map(s=>'<i class="'+(sectionFilled(s)?'on':'')+'"></i>').join('');

  const nav = document.getElementById('navlist');
  let navHtml = '';

  const TRAILING_SPECIALS = new Set(['feedback','guestbook','export','roadmap']);
  const HIDDEN_SPECIALS = new Set(['dashboard','tasklist','accounts','taxonomy','visits']);
  // B·C 그룹은 기본 접힘 (details open 여부)
  const DEFAULT_OPEN = new Set(); // 비어있으면 A그룹(씨앗정의서)만 open

  // 로그인 없이 접근 가능한 special 섹션
  const LOGIN_FREE_SPECIALS = new Set(['landing','curriculum','aitools','promptkit','intro','discover','feedback','guestbook','roadmap','export']);

  function renderNavItem(s){
    const active = s.id===state.cur;
    const filled = !s.special && sectionFilled(s);
    if(s.disabled && !isAdmin){
      if(NAV_GROUPS[s.id]){
        const m = NAV_GROUPS[s.id].match(/^([A-Z])\.\s*(.+)$/);
        return '<li><button type="button" class="navbtn sub" disabled>'+
          '<span class="num">'+esc(m?m[1]:'')+'</span>'+esc(m?m[2]:NAV_GROUPS[s.id])+'<span class="ex-note" style="margin-left:auto">사용 안 함</span></button></li>';
      }
      return '<li><button type="button" class="navbtn sub" disabled>'+
        '<span class="num">'+s.num+'</span>'+esc(s.title)+'<span class="ex-note" style="margin-left:auto">'+esc(s.disabledNote||'준비 중')+'</span></button></li>';
    }
    // 로그인 필요 섹션 — 클릭 가능, 🔒 표시 (클릭하면 블러 오버레이 뜸)
    const needsLogin = !currentUser && !isAdmin && !LOGIN_FREE_SPECIALS.has(s.special);
    if(needsLogin){
      const isGrpHead = !!NAV_GROUPS[s.id];
      const m = isGrpHead ? NAV_GROUPS[s.id].match(/^([A-Z])\.\s*(.+)$/) : null;
      const num = m ? m[1] : s.num;
      const label = m ? m[2] : s.title;
      return '<li><button type="button" class="navbtn'+(isGrpHead?'':' sub')+'" data-action="goto" data-target="'+s.id+'" style="opacity:0.55;" title="로그인 후 이용 가능해요">'+
        '<span class="num">'+esc(num)+'</span>'+esc(label)+'<span style="margin-left:auto;font-size:10px;">🔒</span></button></li>'+
        (s.id==='s17'||s.id==='example'||s.id==='mydash' ? '<hr class="navdivider">' : '');
    }
    const dim = isSectionLocked(s);
    const st = sectionStatus(s);
    const stMark = st==='done' ? '<span class="sec-status st-done">완료</span>' : st==='partial' ? '<span class="sec-status st-partial">작성중</span>' : '<span class="dot"></span>';
    const isTop = s.special==='export'||s.special==='intro'||s.special==='example'||s.special==='mydash'||s.special==='feedback'||s.special==='curriculum'||s.special==='aitools'||s.special==='promptkit'||s.special==='guestbook'||s.special==='landing'||s.special==='discover';
    return '<li><button type="button" class="navbtn'+(active?' active':'')+(filled?' filled':'')+(dim?' dim':'')+(isTop?'':' sub')+'" data-action="goto" data-target="'+s.id+'">'+
      '<span class="num">'+s.num+'</span>'+esc(s.title)+stMark+'</button></li>'+
      (s.id==='s17'||s.id==='example'||s.id==='mydash' ? '<hr class="navdivider">' : '');
  }

  // 섹션 분류
  let groups = [];
  let noGroupItems = [];
  let afterGroupItems = [];
  let curGroup = null;

  SECTIONS.filter(s=>!HIDDEN_SPECIALS.has(s.special)).forEach(s=>{
    if(NAV_GROUPS[s.id]){
      curGroup = {groupId:s.id, groupLabel:NAV_GROUPS[s.id], items:[s]};
      groups.push(curGroup);
    } else if(s.special && TRAILING_SPECIALS.has(s.special)){
      afterGroupItems.push(s);
    } else if(curGroup){
      curGroup.items.push(s);
    } else {
      noGroupItems.push(s);
    }
  });

  // 상단 고정 섹션
  navHtml += noGroupItems.map(renderNavItem).join('');

  // 그룹 → <details> 로 렌더
  groups.forEach(g => {
    // 기본: A그룹만 열림, B·C는 접힘. 사용자가 열면 localStorage에 저장
    const storageKey = 'ddugi_nav_open_'+g.groupId;
    const defaultOpen = !['s16','s12'].includes(g.groupId);
    const isOpen = localStorage.getItem(storageKey) !== null
      ? localStorage.getItem(storageKey) === '1'
      : defaultOpen;
    const itemsHtml = g.items.map(renderNavItem).join('');
    navHtml +=
      '<details class="navdetails"'+(isOpen?' open':'')+' id="navdetails-'+g.groupId+'" '+
        'ontoggle="localStorage.setItem(\'ddugi_nav_open_'+g.groupId+'\',this.open?\'1\':\'0\')">'+
        '<summary class="navgroup-summary">'+esc(g.groupLabel)+'</summary>'+
        '<ul class="navlist">'+itemsHtml+'</ul>'+
      '</details>';
  });

  // 하단 섹션
  if(afterGroupItems.length){
    navHtml += '<hr class="navdivider">';
    navHtml += afterGroupItems.map(renderNavItem).join('');
  }

  // 관리자
  if(isAdmin){
    const adminBtn = s => s ? '<li><button type="button" class="navbtn sub'+(state.cur===s.id?' active':'')+'" data-action="goto" data-target="'+s.id+'">'+
      '<span class="num">'+s.num+'</span>'+esc(s.title)+'<span class="dot"></span></button></li>' : '';
    const adminItems = adminBtn(SECTIONS.find(s=>s.id==='tasklist')) +
      adminBtn(SECTIONS.find(s=>s.id==='dashboard')) +
      adminBtn(SECTIONS.find(s=>s.id==='taxonomy')) +
      '<li><button type="button" class="navbtn sub" data-admin-pw><span class="num">⚿</span>비밀번호 변경</button></li>';
    navHtml += '<hr class="navdivider">'+
      '<details class="navdetails" open id="navdetails-__admin__">'+
        '<summary class="navgroup-summary">관리자 · 실무</summary>'+
        '<ul class="navlist">'+adminItems+'</ul>'+
      '</details>';
    if(isMaster){
      const masterItems = adminBtn(SECTIONS.find(s=>s.id==='accounts')) + adminBtn(SECTIONS.find(s=>s.id==='visits'));
      navHtml +=
        '<details class="navdetails" open id="navdetails-__master__">'+
          '<summary class="navgroup-summary">마스터</summary>'+
          '<ul class="navlist">'+masterItems+'</ul>'+
        '</details>';
    }
  }
  nav.innerHTML = navHtml;
}

function ckStr(f){
  const v = getV(f.id, []).filter(x=>!f.optsFn || checklistOpts(f).indexOf(x)>-1);
  return (v && v.length ? v.join(', ') : '_(선택 없음)_') + (f.other && getV(f.id+'_other','') ? ' / 기타: '+getV(f.id+'_other','') : '');
}
// 섹션 정의(SECTIONS)를 그대로 따라가며 Markdown 생성: 양식이 바뀌어도 export를 따로 고칠 필요 없음
function mdVal(v){ return String(v||'').trim() || '_(미작성)_'; }
function mdField(f){
  const g=(id,d)=>getV(id,d);
  const filledRow = r => Object.keys(r||{}).some(k=>k!=='_on' && String(r[k]||'').trim());
  switch(f.type){
    case 'hint': return '';
    case 'diffhint': return '';
    case 'static': return '**'+f.label+'**: '+f.value+'\n\n';
    case 'redefref': return '';
    case 'row': return f.children.map(c=>'**'+c.label+'**: '+(String(g(c.id,'')).trim()||'_(미작성)_')).join(' / ')+'\n\n';
    case 'text': case 'textarea': return '**'+f.label+'**\n'+mdVal(g(f.id,''))+'\n\n';
    case 'radio': return '**'+f.label+'**: '+(g(f.id,'') || '_(미선택)_')+'\n\n';
    case 'checklist': return '**'+f.label+'**: '+ckStr(f)+'\n\n';
    case 'dlist': {
      const v = g(f.id,[]).filter(x=>String(x||'').trim());
      return '**'+f.label+'**\n'+(v.length ? v.map((x,i)=>(i+1)+'. '+x).join('\n') : '_(미작성)_')+'\n\n';
    }
    case 'ftable': {
      const v = g(f.id,{});
      const rows = f.rows.filter(r=> f.check ? (v[r] && v[r]._on) : filledRow(v[r]));
      if(!rows.length) return '**'+f.label+'**\n'+(f.check ? '_(선택 없음)_' : '_(미작성)_')+'\n\n';
      return '**'+f.label+'**\n\n| 구분 | '+f.cols.join(' | ')+' |\n|---|'+f.cols.map(()=>'---').join('|')+'|\n'+
        rows.map(r=>'| '+r+' | '+f.cols.map(c=>(v[r]&&v[r][c])||'').join(' | ')+' |').join('\n')+'\n\n';
    }
    case 'dtable': {
      const rows = g(f.id,[]).filter(filledRow);
      if(!rows.length) return '**'+f.label+'**\n_(미작성)_\n\n';
      return '**'+f.label+'**\n\n| '+f.cols.join(' | ')+' |\n|'+f.cols.map(()=>'---').join('|')+'|\n'+
        rows.map(r=>'| '+f.cols.map(c=>r[c]||'').join(' | ')+' |').join('\n')+'\n\n';
    }
    case 'repeat': {
      const items = g(f.id,[]).filter(filledRow);
      if(!items.length) return '**'+f.label+'**\n_(미작성)_\n\n';
      return '**'+f.label+'**\n'+items.map((it,i)=>'- #'+(i+1)+'\n'+f.subs.map(sb=>'  - '+sb.label+': '+(it[sb.id]||'')).join('\n')).join('\n')+'\n\n';
    }
    case 'lptable': { const v = getV(f.store,[]); return '**'+f.label+'**: '+(v.length ? v.join(', ') : '_(선택 없음)_')+'\n\n'; }
    case 'ailevel': { const r = recognizedLevel();
      return '**AI 역량 레벨**: 학습 '+lvLabel(aiLevel(getV('lp_done',[])))+' (자기 체크) / 인정 '+(r ? lvLabel(r) : '없음')+' (관리자 확인)\n\n'; }
    case 'check17': return f.groups.map(gr=>gr.items.map(it=>'- ['+(getV('ck_'+it.id,false)?'x':' ')+'] '+it.label).join('\n')).join('\n')+'\n\n';
    case 'gate': { const r = gateReviewNow();
      return '**13-2. Gate 결과물**\n\n'+mdVal(getV('g_evidence',''))+'\n\n**13-3. AI 1차 판정 (AI 작성)**\n\n'+mdVal(getV('g_ai_result',''))+'\n\n'+
        '**관리자 확인**: '+(r ? r.decision+(r.note ? ' ('+r.note+')' : '') : '대기')+'\n\n'; }
    default: return '';
  }
}
function buildMarkdown(){
  let md = '# AI 업무효율화 고민거리 정의서\n\n';
  SECTIONS.forEach(sec=>{
    if(sec.special==='verify'){
      md += '## '+sec.num+'. AI 검증 결과 (AI 작성)\n\n'+mdVal(getV('verify_result',''))+'\n\n';

      return;
    }
    if(sec.special) return;
    md += '## '+sec.num+'. '+sec.title+'\n\n' + sec.fields.map(mdField).join('');
  });
  return md;
}

3. Rule 기반 처리
4. 데이터 집계/조회
5. 기존 시스템 기능 개선
6. 생성형 AI
7. AI Agent 또는 AI 시스템

항상 작은 해결책부터 검토합니다.

**"AI 불필요"는 실패 결과가 아닙니다.** AI보다 더 단순한 해결책이 적합하다면 그것을 명확하게 설명하고, 다른 단계에서 AI를 적용할 수 있는지 탐색합니다.

---

# 5. AI와 사람의 역할을 분리한다

가능하면 다음 구조를 우선합니다.

**AI 분석 → 후보/신호 제시 → 사람 검토 → 최종 판단**

AI가 담당할 수 있는 영역: 대량 정보 검색 / 문서 요약 / 분류 / 후보 추출 / 패턴 탐색 / 반복적인 정보 처리 / 초안 생성
사람이 담당해야 하는 영역: 업무 목적 판단 / 결과 해석 / 원인 확인 / 예외 판단 / 최종 의사결정

---

# 6. 과도한 주장을 하지 않는다

근거 없이 다음 표현을 사용하지 않습니다.
미래 예측 / 자동 의사결정 / 최적화 / 정확한 추천 / 업무 완전 자동화 / 혁신 / 생산성 향상 / 비용 절감

예측을 제안하려면 최소한 확인합니다: 예측 대상 / 충분한 과거 데이터 / 주요 변수 / 학습/검증 데이터 / 성능 측정 방법

---

# 7. AI Slop을 탐지한다

다음에 해당하면 AI Slop 위험으로 표시합니다.

- AI를 사용했다는 사실 자체가 성과인 경우
- 문제보다 결과물의 화려함이 강조되는 경우
- AI가 없어도 동일하게 해결되는 경우
- 단순 자동화를 AI 혁신으로 포장하는 경우
- 데이터가 부족한데 예측/추천을 주장하는 경우
- AI 결과의 검증 방법이 없는 경우
- 사람의 최종 판단이 정의되지 않은 경우
- 효과 측정 지표가 없는 경우
- 구현 난이도에 비해 실제 업무 효과가 작은 경우

AI Slop 위험이 발견되면 비판하기보다 이렇게 제안합니다.
> "현재 구조에서는 AI보다 단순 자동화가 더 적합할 가능성이 있습니다. ○○ 단계처럼 사람이 판단하기 전에 후보를 줄여주는 영역부터 검토해보는 방법이 있습니다."

---

# 8. 검증 결과 출력 형식

각 후보마다 ①~⑩ 형식으로 평가합니다.

### ① 문제 정의
- 현재 업무:
- 핵심 문제:
- 업무 영향:

### ② 현재 제안의 성격
단순 자동화 / 데이터 분석 / 정보 검색 / 의사결정 지원 / AI 활용 / AI 시스템 / 업무 프로세스 재설계 중 하나 이상으로 분류

### ③ AI 적합성
**적합 / 부분 적합 / 부적합** — 판단 근거 포함

### ④ 과도한 주장 여부
현재 데이터로 확인할 수 없는 효과나 주장이 있는지 확인. 필요하면 표현 수정.

### ⑤ AI와 사람의 역할
| 단계 | AI | 사람 |
|---|---|---|
| 데이터 수집 | | |
| 분석 | | |
| 후보 도출 | | |
| 검증 | | |
| 최종 판단 | | |

### ⑥ 최소 해결안
AI 없이 해결할 수 있는 가장 단순한 방법

### ⑦ AI 적용안
AI가 실제로 추가적인 가치를 만드는 영역만 제안

### ⑧ 필요한 추가 데이터
현재 판단에 부족한 정보

### ⑨ AI Slop 위험
**낮음 / 중간 / 높음** — 위험 요인 구체적으로 설명

### ⑩ 최종 과제 정의
과장된 표현 제거 후 실제 업무에 맞는 한 문장

---

# 9. 후보 요약표

모든 후보 평가 후:

| 후보 | 한 줄 요약 | AI 적합성 | AI Slop 위험 |
|---|---|---|---|

---

# 10. AI가 적합하지 않은 후보 처리

"부적합"으로 끝내지 않고 적절한 대안을 제안합니다.
기존 기능 활용 / 단순 자동화 / Rule 기반 처리 / 데이터 조회 / 기존 시스템 기능 개선 / 업무 프로세스 변경

> "현재 설명된 문제에서는 ○○ 방식으로도 목적을 달성할 수 있어 보입니다. 다만 ○○ 단계에서 비정형 정보 처리나 판단 부담이 발생한다면 그 부분은 별도의 AI 후보로 다시 살펴볼 수 있습니다."

---

# 11. 핵심 요약

후보 요약표 다음에 **3~5줄의 핵심 요약**을 작성합니다.
포함: 현재 문제 / 주요 후보 / AI가 필요한 영역 / AI가 필요하지 않은 영역 / 다음 단계에서 검토할 과제

---

# 최종 원칙

> **AI를 적용할 수 있는가보다 AI를 적용해야 하는가를 먼저 판단한다.**
> **AI가 필요하지 않다는 판단도 유효한 결과다.**
> **AI가 판단을 대신하기보다 사람이 판단할 대상을 줄이고 명확하게 만든다.**
> **화려한 결과물보다 실제 업무 변화와 측정 가능한 효과를 우선한다.**
`;
