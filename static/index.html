/* ============== event delegation ============== */
function ensureArr(id, len){
  let v = getV(id, null);
  if(!Array.isArray(v)) v = len!=null ? new Array(len).fill('') : [];
  return v;
}

document.addEventListener('input', function(e){
  const t = e.target;
  if(t.id==='taskListSearch'){ renderTaskListBody(); return; }
  if(t.matches('[data-bind]')){
    setV(t.getAttribute('data-bind'), t.value);
    const g = document.getElementById('gateOut'); if(g) g.value = buildGatePrompt();
    return;
  }
  if(t.matches('[data-ftable]')){
    const id=t.getAttribute('data-ftable'), row=t.getAttribute('data-row'), col=t.getAttribute('data-col');
    const v = getV(id, {});
    v[row] = v[row]||{}; v[row][col]=t.value;
    // 체크 안 해도 내용을 적으면 자동으로 체크됨 (체크박스로 수동 on/off도 그대로 가능)
    const f = findField(id);
    if(f && f.check && t.value.trim() && !v[row]._on){
      v[row]._on = true;
      const tr = t.closest('tr');
      if(tr){ tr.classList.remove('off'); const cb = tr.querySelector('[data-ftcheck]'); if(cb) cb.checked = true; }
    }
    setV(id, v);
    return;
  }
  if(t.matches('[data-dtable]')){
    const id=t.getAttribute('data-dtable'), idx=+t.getAttribute('data-idx'), col=t.getAttribute('data-col');
    const v = getV(id, [{}]);
    v[idx] = v[idx]||{}; v[idx][col]=t.value;
    setV(id, v);
    return;
  }
  if(t.matches('[data-dlist]')){
    const id=t.getAttribute('data-dlist'), idx=+t.getAttribute('data-idx');
    const v = getV(id, ['']);
    v[idx]=t.value;
    setV(id, v);
    return;
  }
  if(t.matches('[data-repeat]')){
    const id=t.getAttribute('data-repeat'), idx=+t.getAttribute('data-idx'), sub=t.getAttribute('data-sub');
    const v = getV(id, [{}]);
    v[idx]=v[idx]||{}; v[idx][sub]=t.value;
    setV(id, v);
    return;
  }
});

document.addEventListener('change', function(e){
  const t = e.target;
  if(t.id==='taskListStage' || t.id==='taskListSort'){ renderTaskListBody(); return; }
  if(t.matches('[data-checklist]')){
    const id=t.getAttribute('data-checklist'), opt=t.getAttribute('data-opt');
    const v = getV(id, []).slice();
    const i = v.indexOf(opt);
    if(t.checked && i===-1) v.push(opt);
    if(!t.checked && i>-1) v.splice(i,1);
    setV(id, v);
    if(id==='lp_done' || id==='lp_plan' || opt==='기타'){ renderSheet(); return; }
    t.closest('.opt').classList.toggle('checked', t.checked);
    return;
  }
  if(t.matches('[data-radio]')){
    const id=t.getAttribute('data-radio'), opt=t.getAttribute('data-opt');
    setV(id, opt);
    if(id==='s1_cat' || id==='g_level'){ renderSheet(); return; }
    t.closest('.opts').querySelectorAll('.opt').forEach(o=>o.classList.remove('checked'));
    t.closest('.opt').classList.add('checked');
    return;
  }
  if(t.matches('[data-ftcheck]')){
    const id=t.getAttribute('data-ftcheck'), row=t.getAttribute('data-row');
    const v = getV(id, {});
    v[row] = v[row]||{}; v[row]._on = t.checked;
    setV(id, v);
    renderSheet();
    return;
  }
  if(t.matches('[data-check17]')){
    setV('ck_'+t.getAttribute('data-check17'), t.checked);
    renderSheet();
    return;
  }
});

document.addEventListener('click', function(e){
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.getAttribute('data-action');
  const target = btn.getAttribute('data-target');

  if(action==='lp-refresh'){ renderSheet(); return; }
  // 역량 체크 전체 선택/해제 (계획 표에서는 이미 경험한 항목 제외)
  if(action==='lp-all' || action==='lp-none' || action==='lp-level'){
    if(state.locked) return;
    const [store, lvStr] = target.split('|');
    const done = store==='lp_plan' ? getV('lp_done',[]) : [];
    const pool = (lvStr ? AI_LEVELS[+lvStr-1].items : AI_LEVELS.reduce((a,L)=>a.concat(L.items), [])).filter(i=>done.indexOf(i)<0);
    let cur = getV(store,[]).slice();
    const allOn = pool.every(i=>cur.indexOf(i)>-1);
    const turnOn = action==='lp-all' || (action==='lp-level' && !allOn);
    if(action==='lp-none' && store==='lp_done' && cur.length && !confirm('경험해본 항목 체크를 모두 해제할까요?')) return;
    cur = turnOn ? cur.concat(pool.filter(i=>cur.indexOf(i)<0)) : cur.filter(i=>pool.indexOf(i)<0);
    setV(store, cur); renderSheet(); return;
  }
  if(action==='lp-add'){
    const plan = getV('lp_plan',[]).slice(), done = getV('lp_done',[]);
    target.split('|').forEach(i=>{ if(plan.indexOf(i)<0 && done.indexOf(i)<0) plan.push(i); });
    setV('lp_plan', plan); renderSheet(); return;
  }
  if(action==='gate-mail'){ location.href = buildGateMailtoHref(); return; }
  if(action==='acct-add'){
    const idEl=document.getElementById('newAcctId'), nameEl=document.getElementById('newAcctName'), codeEl=document.getElementById('newAcctCode');
    const msg = document.getElementById('acctMsg');
    const id=idEl.value.trim(), name=nameEl.value.trim(), code=codeEl.value;
    if(!id){ msg.textContent='아이디를 입력하세요.'; return; }
    if(code.length<6){ msg.textContent='비밀번호는 6자 이상이어야 해요.'; return; }
    fetch('/api/master/accounts', {method:'POST', headers:Object.assign({'Content-Type':'application/json'}, authHeaders()), body: JSON.stringify({empId:id, name, code})})
      .then(async r=>{
        if(r.ok){ idEl.value=''; nameEl.value=''; codeEl.value=''; msg.textContent=''; renderAccounts(); }
        else{ msg.textContent = await adminErrorText(r); }
      }).catch(()=>{ msg.textContent = '서버에 연결할 수 없어요.'; });
    return;
  }
  if(action==='acct-del'){
    if(!confirm('아이디 '+target+'의 관리자 권한을 없앨까요?')) return;
    fetch('/api/master/accounts/'+encodeURIComponent(target), {method:'DELETE', headers: authHeaders()})
      .then(async r=>{ if(r.ok) renderAccounts(); else alert(await adminErrorText(r)); })
      .catch(()=>alert('서버에 연결할 수 없어요.'));
    return;
  }
  if(action==='tax-save'){ saveTaxonomy(target); return; }
  if(action==='intro-edit'){ if(!isMaster) return; introEditing = (target==='on'); renderSheet(); return; }
  if(action==='discover-carry'){
    const chosen = String(getV('discover_chosen','')).trim();
    if(!chosen) return;
    // 실제 값을 덮어쓰지 않고 placeholder(예: ...)로만 보여줌 — 1-7처럼 사용자가 입력하는 순간 사라짐
    setV('s2_core_hint', '예: '+chosen);
    setV('s1_hypo_hint', '예: '+chosen);
    state.cur = 's1';
    persist();
    renderSheet();
    document.getElementById('main').scrollTo(0,0);
    return;
  }
  if(action==='data-candidates-parse'){
    const raw = String(getV('s11_data_raw','')).trim();
    if(!raw) return;
    const items = raw.split('\n').map(s=>s.replace(/^[-*•\d.\)]+\s*/,'').trim()).filter(Boolean);
    if(!items.length) return;
    setV('s11_data_candidates', items);
    renderSheet();
    return;
  }
  if(action==='codetest-carry'){
    const ai = String(getV('s12_ai_raw','')).trim();
    if(!ai) return;
    const preview = ai.length>300 ? ai.slice(0,300)+'…' : ai;
    setV('s12_1_hint', '예: '+preview);
    renderSheet();
    return;
  }
  if(action==='tools-toggle'){ state.showAllTools = !state.showAllTools; persist(); renderSheet(); return; }
  if(action==='gate-ok' || action==='gate-fix'){
    const i = target.indexOf('|');
    postGateReview(target.slice(0,i), target.slice(i+1), action==='gate-ok' ? '인정' : '보완 요청'); return;
  }
  if(action==='ex-all'){
    document.querySelectorAll('#sheet details.ex-sec').forEach(d=>{ d.open = (target==='open'); });
    return;
  }
  if(action==='ex-tab'){ exampleTab = target; renderSheet(); document.getElementById('main').scrollTo(0,0); return; }
  if(action==='onb-meta'){ onboardingMetaTab = target; renderSheet(); document.getElementById('main').scrollTo(0,0); return; }
  if(action==='conv-pick'){ convVersion = target; convStep = 0; convAnswers = ['','','','','','']; renderSheet(); return; }
  if(action==='conv-next'){
    var ci = document.getElementById('convInput');
    if(ci) convAnswers[convStep] = ci.value;
    convStep++; renderSheet(); return;
  }
  if(action==='conv-prev'){
    var ci2 = document.getElementById('convInput');
    if(ci2) convAnswers[convStep] = ci2.value;
    if(convStep > 0) convStep--;
    renderSheet(); return;
  }
  if(action==='conv-fill'){
    // Map answers to s1 fields
    if(convAnswers[0]) { setV('s1_dept', convAnswers[0]); }
    if(convAnswers[1]) { setV('s1_name', convAnswers[1]); setV('s2_core', convAnswers[1]); }
    if(convAnswers[4]) { setV('s1_hypo', convAnswers[4]); }
    if(convAnswers[5]) { setV('s1_goal', convAnswers[5]); }
    state.cur = 's1'; renderSheet(); document.getElementById('main').scrollTo(0,0); return;
  }
  if(action==='conv-restart'){ convVersion = null; convStep = 0; convAnswers = ['','','','','','']; renderSheet(); return; }
  if(action==='goto'){
    if(!target) return;
    if((target==='dashboard' || target==='tasklist' || target==='taxonomy') && !isAdmin) return;
    if(target==='accounts' && !isMaster) return;
    if(target==='visits' && !isMaster) return;
    { const tsec = SECTIONS.find(s=>s.id===target); if(tsec && tsec.disabled && !isMaster) return; }
    state.cur = target;
    persist();
    renderSheet();
    document.getElementById('main').scrollTo(0,0);
    closeSidebarMobile();
    return;
  }
  if(action==='add-dtable'){
    const f = findField(target);
    const v = getV(target, []).slice();
    const empty = {}; f.cols.forEach(c=>empty[c]='');
    v.push(empty);
    setV(target, v);
    document.getElementById('fbody-'+target).innerHTML = renderDTableBody(f);
    return;
  }
  if(action==='rm-dtable'){
    const idx=+btn.getAttribute('data-idx');
    const f = findField(target);
    const v = getV(target, []).slice();
    v.splice(idx,1);
    setV(target, v);
    document.getElementById('fbody-'+target).innerHTML = renderDTableBody(f);
    return;
  }
  if(action==='add-dlist'){
    const f = findField(target);
    const v = getV(target, ['']).slice();
    v.push('');
    setV(target, v);
    document.getElementById('fbody-'+target).innerHTML = renderDListBody(f);
    return;
  }
  if(action==='rm-dlist'){
    const idx=+btn.getAttribute('data-idx');
    const f = findField(target);
    const v = getV(target, ['']).slice();
    v.splice(idx,1);
    setV(target, v);
    document.getElementById('fbody-'+target).innerHTML = renderDListBody(f);
    return;
  }
  if(action==='add-repeat'){
    const f = findField(target);
    const v = getV(target, [{}]).slice();
    v.push({});
    setV(target, v);
    document.getElementById('fbody-'+target).innerHTML = renderRepeatBody(f);
    return;
  }
  if(action==='rm-repeat'){
    const idx=+btn.getAttribute('data-idx');
    const f = findField(target);
    const v = getV(target, [{}]).slice();
    v.splice(idx,1);
    setV(target, v);
    document.getElementById('fbody-'+target).innerHTML = renderRepeatBody(f);
    return;
  }
});

function findField(id){
  for(const sec of SECTIONS){
    if(!sec.fields) continue;
    for(const f of sec.fields){
      if(f.id===id) return f;
      if(f.type==='row'){ const c=f.children.find(c=>c.id===id); if(c) return c; }
    }
  }
  return null;
}

document.addEventListener('click', function(e){
  if(e.target.hasAttribute('data-copy')){
    const ta = document.getElementById(e.target.getAttribute('data-copy'));
    ta.select();
    let ok=false;
    try{ ok = document.execCommand('copy'); }catch(err){}
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).catch(()=>{});
    }
    const msg = document.querySelector('.copymsg[data-for="'+ta.id+'"]') || document.getElementById('saveMsg');
    if(msg){ msg.textContent = ok || (navigator.clipboard) ? '복사됨' : '수동으로 선택 후 복사해주세요'; setTimeout(()=>{ if(msg) msg.textContent=''; },1800); }
  }
  if(e.target.id==='dlBtn'){
    downloadMd();
  }
});

function downloadMd(){
  const md = document.getElementById('exportOut').value;
  const filename = (getV('s1_name','고민거리 정의서').trim() || '고민거리 정의서') + '.md';
  try{
    const blob = new Blob([md], {type:'text/markdown'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    const msg=document.getElementById('saveMsg');
    if(msg) msg.textContent = '다운로드를 지원하지 않는 환경입니다. 내용을 복사해 저장해주세요.';
  }
}

renderAdminSlot();
renderSheet();
loadRemote().then(renderSheet);
loadTaxonomy();

// 맨 위로: 본문 스크롤이 길어지면 표시
(function(){
  const main = document.getElementById('main'), btn = document.getElementById('toTop');
  main.addEventListener('scroll', function(){ btn.classList.toggle('show', main.scrollTop > 400); }, {passive:true});
  btn.addEventListener('click', function(){ main.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); });
})();
})();
</script>
